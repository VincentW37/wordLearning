<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vocab Learner</title>
  <style>
    :root {
      --primary: #002147;
      --accent-blue: #0284c7;
      --accent-yellow: #f59e0b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: env(safe-area-inset-top, 8px) 10px env(safe-area-inset-bottom, 8px) 10px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 6px;
    }

    /* 頂欄 */
    .top-bar {
      background: #fff;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .pill-scroll-row {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .pill-scroll-row::-webkit-scrollbar {
      display: none;
    }

    .level-pill {
      padding: 4px 10px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 0.8rem;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }

    .level-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .level-pill.c2.active {
      background: #6b21a8;
      border-color: #6b21a8;
    }

    .pref-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
      border-top: 1px dashed var(--border);
      padding-top: 4px;
    }

    .toggle-group {
      display: flex;
      gap: 12px;
    }

    .toggle-item {
      display: flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
      user-select: none;
    }

    .count-text {
      font-size: 0.75rem;
      font-weight: 500;
    }

    /* 中間動態卡片 */
    .card-wrapper {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 14px 16px;
      border: 1px solid var(--border);
      box-shadow: 0 3px 12px rgba(0, 33, 71, 0.05);
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 100%;
      overflow-y: auto;
    }

    .word-header {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .word-title {
      font-size: 2.1rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.1;
      letter-spacing: -0.5px;
      word-break: break-word;
    }

    .pos-tag {
      font-style: italic;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .zh-word-translation {
      font-size: 1.15rem;
      font-weight: 600;
      color: #047857;
      line-height: 1.2;
    }

    .pron-bar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--accent-yellow);
    }

    .pron-group {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .pron-region {
      font-weight: 700;
      font-size: 0.78rem;
      color: var(--accent-blue);
    }

    .ipa {
      font-family: "Lucida Sans Unicode", "DejaVu Sans", Arial, sans-serif;
      font-size: 0.85rem;
      color: #334155;
    }

    .audio-btn {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      cursor: pointer;
      color: var(--accent-blue);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
    }

    .cefr-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      width: fit-content;
    }

    .cefr-badge.c2 { background: #fae8ff; color: #6b21a8; }
    .cefr-badge.c1 { background: #f3e8ff; color: #7e22ce; }
    .cefr-badge.b2, .cefr-badge.b1 { background: #e0f2fe; color: #0369a1; }
    .cefr-badge.a2, .cefr-badge.a1 { background: #dcfce7; color: #15803d; }

    .def-container {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .definition-en {
      font-size: 1rem;
      font-weight: 600;
      line-height: 1.35;
      color: #1e293b;
    }

    .definition-zh {
      font-size: 0.9rem;
      color: #475569;
      line-height: 1.3;
    }

    .examples-box {
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 8px;
      border-left: 3px solid var(--accent-blue);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .examples-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    .example-item {
      font-size: 0.88rem;
      line-height: 1.35;
      color: #334155;
    }

    /* 底欄 */
    .bottom-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      flex-shrink: 0;
      padding: 2px 0;
    }

    .btn-nav {
      flex: 1;
      padding: 10px 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--text);
    }

    .btn-nav:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-nav.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-nav.history {
      background: #f1f5f9;
      color: #334155;
    }

    /* 歷史彈窗 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1rem;
    }

    .modal-overlay.open { display: flex; }

    .modal-card {
      background: #fff;
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      max-height: 75vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.4rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .modal-body {
      padding: 8px 12px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .history-item {
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }

    .history-item:hover {
      background: #eff6ff;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="top-bar">
      <div class="pill-scroll-row">
        <div class="level-pill" data-level="ALL">全部</div>
        <div class="level-pill" data-level="A1">A1</div>
        <div class="level-pill" data-level="A2">A2</div>
        <div class="level-pill" data-level="B1">B1</div>
        <div class="level-pill" data-level="B2">B2</div>
        <div class="level-pill" data-level="C1">C1</div>
        <div class="level-pill c2" data-level="C2">C2</div>
      </div>

      <div class="pref-row">
        <div class="toggle-group">
          <label class="toggle-item">
            <input type="checkbox" id="showZhToggle" checked> 中文
          </label>
          <label class="toggle-item">
            <input type="checkbox" id="autoPronounceToggle"> 自動發音
          </label>
        </div>
        <span class="count-text" id="countSummary">載入中...</span>
      </div>
    </div>

    <div class="card-wrapper">
      <div class="card" id="touchCard">
        <div class="word-header">
          <h1 class="word-title" id="wordText">---</h1>
          <span class="pos-tag" id="posText"></span>
        </div>

        <div class="zh-word-translation" id="zhWordText">---</div>

        <div class="pron-bar">
          <div class="pron-group">
            <span class="pron-region">UK</span>
            <button class="audio-btn" id="ukAudioBtn">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
              </svg>
            </button>
            <span class="ipa" id="ukIpa"></span>
          </div>

          <div class="pron-group">
            <span class="pron-region">US</span>
            <button class="audio-btn" id="usAudioBtn">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
              </svg>
            </button>
            <span class="ipa" id="usIpa"></span>
          </div>
        </div>

        <div id="cefrBadge" class="cefr-badge b2">B2</div>

        <div class="def-container">
          <div class="definition-en" id="defEnText">---</div>
          <div class="definition-zh" id="defZhText">---</div>
        </div>

        <div class="examples-box">
          <div class="examples-title">Example</div>
          <div id="examplesContainer">---</div>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <button class="btn-nav history" id="historyBtn">📜 歷史</button>
      <button class="btn-nav" id="prevBtn" disabled>← 上一個</button>
      <button class="btn-nav primary" id="nextBtn">下一個 🎲</button>
    </div>
  </div>

  <div class="modal-overlay" id="historyModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📜 最近學習記錄（最多 10 個）</div>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <div class="modal-body" id="historyListContainer"></div>
    </div>
  </div>

  <script>
    const OXFORD_5000_URL = "https://raw.githubusercontent.com/winterdl/oxford-5000-vocabulary-audio-definition/main/data/oxford_5000.json";
    const PREF_KEY = "vocab_app_prefs_v6";

    const c2WordList = [
      {
        word: "ubiquitous",
        pos: "adjective",
        level: "C2",
        ipa: "/juːˈbɪk.wə.təs/",
        zh: "無處不在的；普遍存在的",
        definition: "seeming to be in all places at the same time:",
        zhDef: "似乎無所不在的；十分普遍的",
        examples: ["Smartphones have become ubiquitous in daily life."]
      },
      {
        word: "preposterous",
        pos: "adjective",
        level: "C2",
        ipa: "/prɪˈpɒs.tər.əs/",
        zh: "荒謬的；反常的",
        definition: "very silly or stupid; completely unreasonable:",
        zhDef: "荒唐的；極其荒謬無稽的",
        examples: ["The very idea is preposterous!"]
      },
      {
        word: "ephemeral",
        pos: "adjective",
        level: "C2",
        ipa: "/ɪˈfem.ər.əl/",
        zh: "短暫的；轉瞬即逝的",
        definition: "lasting for only a short time:",
        zhDef: "僅持續很短時間的；短暫的",
        examples: ["Fame in the internet age is often ephemeral."]
      }
    ];

    let fullDataset = [];
    let filteredDataset = [];
    const translationCache = {};

    let historyQueue = [];
    let historyPointer = -1;

    let userPrefs = {
      selectedLevels: ["ALL"],
      showZh: true,
      autoPronounce: false
    };

    function loadUserPreferences() {
      try {
        const saved = localStorage.getItem(PREF_KEY);
        if (saved) userPrefs = Object.assign(userPrefs, JSON.parse(saved));
      } catch (e) {}

      document.getElementById("showZhToggle").checked = userPrefs.showZh;
      document.getElementById("autoPronounceToggle").checked = userPrefs.autoPronounce;

      document.querySelectorAll(".level-pill").forEach(pill => {
        const lvl = pill.dataset.level;
        if (userPrefs.selectedLevels.includes(lvl)) pill.classList.add("active");
        else pill.classList.remove("active");
      });
    }

    function saveUserPreferences() {
      try {
        userPrefs.showZh = document.getElementById("showZhToggle").checked;
        userPrefs.autoPronounce = document.getElementById("autoPronounceToggle").checked;
        localStorage.setItem(PREF_KEY, JSON.stringify(userPrefs));
      } catch (e) {}
    }

    // 繁體中文翻譯器 (專門支援 GitHub Pages CORS 跨域)
    async function translateToZh(text) {
      if (!text) return "";
      const cleanText = text.trim();
      if (translationCache[cleanText]) return translationCache[cleanText];

      // 通道 1: MyMemory API (完全開放 CORS，支援繁體中文 zh-TW / zh-HK)
      try {
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(cleanText)}&langpair=en|zh-TW`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          if (data && data.responseData && data.responseData.translatedText) {
            let resText = data.responseData.translatedText;
            // 避免 API 回傳 MATCH ERROR 等提示
            if (!resText.startsWith("MYMEMORY WARNING")) {
              translationCache[cleanText] = resText;
              return resText;
            }
          }
        }
      } catch (e) {}

      // 通道 2: Lingva 開放式代理通道 (備用)
      try {
        const url = `https://lingva.ml/api/v1/en/zh-TW/${encodeURIComponent(cleanText)}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          if (data && data.translation) {
            translationCache[cleanText] = data.translation;
            return data.translation;
          }
        }
      } catch (e) {}

      return "";
    }

    function normalizeItem(raw) {
      const word = raw.Spelling || raw.spelling || raw.word || raw.headword || "";
      const pos = raw.pos || raw["word type"] || raw.type || "";
      const level = (raw.cefr || raw.CEFR || raw.level || "B2").toUpperCase();
      const ipa = raw["Lexical spelling"] || raw.ipa || raw.pronunciation || "";
      const def = raw.Meaning || raw.meaning || raw.definition || raw.def || "";
      let ex = raw.Example || raw.example || raw.examples || [];
      if (typeof ex === 'string') ex = ex ? [ex] : [];
      if (!Array.isArray(ex) || ex.length === 0) ex = ["(No example sentence)"];

      return {
        word: word.trim(),
        pos: pos.trim(),
        level: level.trim(),
        ipa: ipa.trim(),
        definition: def.trim(),
        zh: raw.zh || "",
        zhDef: raw.zhDef || "",
        examples: ex
      };
    }

    async function initVocabulary() {
      loadUserPreferences();

      try {
        const res = await fetch(OXFORD_5000_URL);
        const rawData = await res.json();
        const rawList = Array.isArray(rawData) ? rawData : Object.values(rawData);
        const oxfordWords = rawList.map(normalizeItem).filter(w => w.word.length > 0);
        fullDataset = [...c2WordList, ...oxfordWords];
      } catch (err) {
        fullDataset = [...c2WordList];
      }

      applyFilters();
      drawRandomNextWord();
    }

    function applyFilters() {
      const activeLevels = userPrefs.selectedLevels;
      if (activeLevels.includes("ALL") || activeLevels.length === 0) {
        filteredDataset = [...fullDataset];
      } else {
        filteredDataset = fullDataset.filter(item => activeLevels.some(lvl => item.level.includes(lvl)));
      }

      document.getElementById("countSummary").textContent = `${filteredDataset.length} 字`;
    }

    function drawRandomNextWord() {
      if (filteredDataset.length === 0) return;

      const randomIdx = Math.floor(Math.random() * filteredDataset.length);
      const chosenWord = filteredDataset[randomIdx];

      if (historyPointer < historyQueue.length - 1) {
        historyQueue = historyQueue.slice(0, historyPointer + 1);
      }

      historyQueue.push(chosenWord);
      historyPointer = historyQueue.length - 1;

      renderCard(chosenWord);
    }

    function goBackHistory() {
      if (historyPointer > 0) {
        historyPointer--;
        renderCard(historyQueue[historyPointer]);
      }
    }

    function renderCard(item) {
      if (!item) return;

      document.getElementById("wordText").textContent = item.word;
      document.getElementById("posText").textContent = item.pos;
      document.getElementById("ukIpa").textContent = item.ipa;
      document.getElementById("usIpa").textContent = item.ipa;

      const badge = document.getElementById("cefrBadge");
      badge.textContent = item.level;
      badge.className = `cefr-badge ${item.level.toLowerCase()}`;

      document.getElementById("defEnText").textContent = item.definition;
      document.getElementById("examplesContainer").innerHTML = item.examples.map(ex => `<div class="example-item">• ${ex}</div>`).join("");

      document.getElementById("prevBtn").disabled = historyPointer <= 0;

      updateChineseTranslations(item);

      if (document.getElementById("autoPronounceToggle").checked) {
        speak(item.word, "en-GB");
      }
    }

    async function updateChineseTranslations(item) {
      const showZh = document.getElementById("showZhToggle").checked;
      const zhWordEl = document.getElementById("zhWordText");
      const defZhEl = document.getElementById("defZhText");

      if (!showZh) {
        zhWordEl.style.display = "none";
        defZhEl.style.display = "none";
        return;
      }

      zhWordEl.style.display = "block";
      defZhEl.style.display = "block";

      // 檢查是否已有中譯
      if (item.zh) {
        zhWordEl.textContent = `【中文】${item.zh}`;
      } else {
        zhWordEl.textContent = "【中文】查詢中...";
        translateToZh(item.word).then(trans => {
          if (trans) {
            item.zh = trans;
            zhWordEl.textContent = `【中文】${trans}`;
          } else {
            zhWordEl.textContent = "";
          }
        });
      }

      if (item.zhDef) {
        defZhEl.textContent = item.zhDef;
      } else if (item.definition) {
        defZhEl.textContent = "翻譯釋義中...";
        translateToZh(item.definition).then(trans => {
          if (trans) {
            item.zhDef = trans;
            defZhEl.textContent = trans;
          } else {
            defZhEl.textContent = "";
          }
        });
      }
    }

    function speak(text, lang = "en-GB") {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }

    // 難度按鈕點擊
    document.querySelectorAll(".level-pill").forEach(pill => {
      pill.addEventListener("click", () => {
        const level = pill.dataset.level;

        if (level === "ALL") {
          userPrefs.selectedLevels = ["ALL"];
          document.querySelectorAll(".level-pill").forEach(p => p.classList.remove("active"));
          pill.classList.add("active");
        } else {
          userPrefs.selectedLevels = userPrefs.selectedLevels.filter(l => l !== "ALL");
          document.querySelector('.level-pill[data-level="ALL"]').classList.remove("active");

          if (userPrefs.selectedLevels.includes(level)) {
            userPrefs.selectedLevels = userPrefs.selectedLevels.filter(l => l !== level);
            pill.classList.remove("active");
          } else {
            userPrefs.selectedLevels.push(level);
            pill.classList.add("active");
          }

          if (userPrefs.selectedLevels.length === 0) {
            userPrefs.selectedLevels = ["ALL"];
            document.querySelector('.level-pill[data-level="ALL"]').classList.add("active");
          }
        }

        saveUserPreferences();
        applyFilters();
        drawRandomNextWord();
      });
    });

    document.getElementById("showZhToggle").addEventListener("change", () => {
      if (historyQueue[historyPointer]) updateChineseTranslations(historyQueue[historyPointer]);
      saveUserPreferences();
    });

    document.getElementById("autoPronounceToggle").addEventListener("change", saveUserPreferences);

    document.getElementById("ukAudioBtn").addEventListener("click", () => {
      if (historyQueue[historyPointer]) speak(historyQueue[historyPointer].word, "en-GB");
    });

    document.getElementById("usAudioBtn").addEventListener("click", () => {
      if (historyQueue[historyPointer]) speak(historyQueue[historyPointer].word, "en-US");
    });

    document.getElementById("nextBtn").addEventListener("click", drawRandomNextWord);
    document.getElementById("prevBtn").addEventListener("click", goBackHistory);

    // 歷史記錄彈窗
    const historyModal = document.getElementById("historyModal");
    const historyBtn = document.getElementById("historyBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const historyListContainer = document.getElementById("historyListContainer");

    historyBtn.addEventListener("click", () => {
      const recentWords = [...historyQueue].reverse().slice(0, 10);
      historyListContainer.innerHTML = "";

      if (recentWords.length === 0) {
        historyListContainer.innerHTML = "<div style='color:var(--text-muted);text-align:center;padding:1rem;'>暫無學習歷史</div>";
      } else {
        recentWords.forEach(item => {
          const div = document.createElement("div");
          div.className = "history-item";
          div.innerHTML = `
            <div>
              <span style="font-weight:700;color:var(--primary);font-size:1rem;">${item.word}</span>
              <span style="font-size:0.75rem;color:var(--text-muted);font-style:italic;margin-left:4px;">${item.pos}</span>
            </div>
            <span style="font-size:0.85rem;color:#047857;font-weight:500;">${item.zh || "點擊查看"}</span>
          `;
          div.addEventListener("click", () => {
            const targetIdx = historyQueue.lastIndexOf(item);
            if (targetIdx !== -1) {
              historyPointer = targetIdx;
              renderCard(historyQueue[historyPointer]);
            }
            historyModal.classList.remove("open");
          });
          historyListContainer.appendChild(div);
        });
      }
      historyModal.classList.add("open");
    });

    closeModalBtn.addEventListener("click", () => historyModal.classList.remove("open"));
    historyModal.addEventListener("click", (e) => {
      if (e.target === historyModal) historyModal.classList.remove("open");
    });

    // 觸控左右滑動
    let touchStartX = 0;
    let touchEndX = 0;
    const cardEl = document.getElementById("touchCard");

    cardEl.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    cardEl.addEventListener("touchend", (e) => {
      touchEndX = e.changedTouches[0].screenX;
      if (touchStartX - touchEndX > 45) {
        drawRandomNextWord();
      } else if (touchEndX - touchStartX > 45) {
        goBackHistory();
      }
    }, { passive: true });

    initVocabulary();
  </script>
</body>
</html>
