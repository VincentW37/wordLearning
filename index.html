<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Learner - Oxford & Cambridge</title>
  <style>
    :root {
      --primary: #002147;
      --accent-blue: #0284c7;
      --accent-yellow: #f59e0b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* 嚴格一版過佈局：禁止頁面出現外層滾動條 */
    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0.5rem;
    }

    .container {
      width: 100%;
      max-width: 660px;
      height: 97vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    /* 頂部難度選擇 Panel (嚴格一行過) */
    .filter-section {
      background: #fff;
      padding: 0.65rem 0.85rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 6px rgba(0, 33, 71, 0.03);
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      flex-shrink: 0;
    }

    /* 核心修復：flex-wrap: nowrap + flex: 1，確保 100% 一行過 */
    .filter-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: nowrap;
      gap: 0.35rem;
      width: 100%;
    }

    .level-pill {
      flex: 1;
      text-align: center;
      padding: 0.45rem 0;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: #f8fafc;
      font-size: 0.88rem;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: all 0.15s ease-in-out;
    }

    .level-pill:hover {
      background: #e2e8f0;
    }

    .level-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .level-pill.c2.active {
      background: #6b21a8;
      border-color: #6b21a8;
    }

    .pref-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px dashed var(--border);
      padding-top: 0.35rem;
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    .pref-toggles {
      display: flex;
      gap: 0.85rem;
    }

    .toggle-item {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      cursor: pointer;
      user-select: none;
    }

    .btn-sub {
      background: #fff;
      border: 1px solid var(--border);
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--primary);
    }

    .btn-sub:hover {
      background: #e2e8f0;
    }

    /* 頂部資訊列 */
    .meta-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 0.2rem;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-muted);
      flex-shrink: 0;
      margin: 0.15rem 0;
    }

    /* 單字主卡片 (撐滿剩餘垂直空間) */
    .card {
      background: var(--card-bg);
      border-radius: 14px;
      padding: 1.15rem 1.4rem;
      box-shadow: 0 4px 16px rgba(0, 33, 71, 0.05);
      border: 1px solid var(--border);
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 0;
      overflow: hidden;
    }

    .card-top {
      flex-shrink: 0;
    }

    .word-header {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }

    .word-title {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .pos-tag {
      font-style: italic;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .zh-word-translation {
      font-size: 1.15rem;
      font-weight: 600;
      color: #047857;
      margin-top: 0.15rem;
    }

    .pron-bar {
      display: flex;
      align-items: center;
      gap: 1.2rem;
      margin: 0.35rem 0 0.6rem 0;
      padding-bottom: 0.5rem;
      border-bottom: 2px solid var(--accent-yellow);
    }

    .pron-group {
      display: flex;
      align-items: center;
      gap: 0.3rem;
    }

    .pron-region {
      font-weight: 700;
      font-size: 0.82rem;
      color: var(--accent-blue);
    }

    .ipa {
      font-family: "Lucida Sans Unicode", "DejaVu Sans", Arial, sans-serif;
      font-size: 0.92rem;
    }

    .audio-btn {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      cursor: pointer;
      color: var(--accent-blue);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
    }

    .cefr-badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 5px;
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      width: fit-content;
    }

    .cefr-badge.c2 { background: #fae8ff; color: #6b21a8; }
    .cefr-badge.c1 { background: #f3e8ff; color: #7e22ce; }
    .cefr-badge.b2, .cefr-badge.b1 { background: #e0f2fe; color: #0369a1; }
    .cefr-badge.a2, .cefr-badge.a1 { background: #dcfce7; color: #15803d; }

    /* 學習模式展示區 */
    .learn-view {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      overflow-y: auto;
    }

    .definition-en {
      font-size: 1.05rem;
      font-weight: 600;
      line-height: 1.38;
      color: #1e293b;
      margin-bottom: 0.2rem;
    }

    .definition-zh {
      font-size: 0.92rem;
      color: #475569;
      line-height: 1.35;
      margin-bottom: 0.5rem;
    }

    .examples-box {
      background: #f8fafc;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      border-left: 3px solid var(--accent-blue);
    }

    .examples-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .example-item {
      font-size: 0.88rem;
      line-height: 1.4;
      color: #334155;
      margin-bottom: 0.2rem;
    }

    /* QUIZ MODE 專屬區域 */
    .quiz-view {
      display: none;
      flex-direction: column;
      justify-content: space-between;
      flex: 1;
      gap: 0.4rem;
      overflow-y: auto;
    }

    .quiz-instruction {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--primary);
      flex-shrink: 0;
    }

    .quiz-options-list {
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      flex: 1;
      justify-content: center;
    }

    .quiz-option-card {
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      background: #f8fafc;
      cursor: pointer;
      display: flex;
      gap: 0.65rem;
      align-items: flex-start;
      transition: all 0.15s;
    }

    .quiz-option-card:hover:not(.locked) {
      background: #eff6ff;
      border-color: var(--accent-blue);
    }

    .option-letter {
      background: #e2e8f0;
      color: var(--primary);
      font-weight: 700;
      font-size: 0.82rem;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 1px;
    }

    .option-content {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .option-en {
      font-size: 0.92rem;
      font-weight: 600;
      color: #1e293b;
      line-height: 1.32;
    }

    .option-zh {
      font-size: 0.85rem;
      color: #047857;
      font-weight: 500;
      line-height: 1.25;
    }

    .quiz-option-card.correct {
      background: #ecfdf5 !important;
      border-color: #10b981 !important;
    }
    .quiz-option-card.correct .option-letter {
      background: #10b981;
      color: #fff;
    }

    .quiz-option-card.wrong {
      background: #fef2f2 !important;
      border-color: #ef4444 !important;
    }
    .quiz-option-card.wrong .option-letter {
      background: #ef4444;
      color: #fff;
    }

    .quiz-option-card.locked { cursor: default; }

    /* 底部控制列 */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.4rem;
      flex-shrink: 0;
    }

    .left-controls {
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .btn {
      padding: 0.6rem 0.95rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.88rem;
      background: #fff;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover { background: #0f3460; }

    .btn-quiz-mode {
      background: #7c3aed;
      color: #fff;
      border-color: #7c3aed;
    }

    .history-indicator {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .nav-group {
      display: flex;
      gap: 0.45rem;
    }

    /* 歷史彈窗 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      background: #fff;
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      max-height: 70vh;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      padding: 0.85rem 1.1rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
    }
    .modal-body {
      padding: 0.75rem 1.1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .history-item {
      padding: 0.55rem 0.75rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .history-item:hover { background: #eff6ff; }
  </style>
</head>
<body>

  <div class="container">
    <!-- 頂部難度選擇 (嚴格一行過) -->
    <div class="filter-section">
      <div class="filter-row">
        <div class="level-pill" data-level="ALL">全部</div>
        <div class="level-pill" data-level="A1">A1</div>
        <div class="level-pill" data-level="A2">A2</div>
        <div class="level-pill" data-level="B1">B1</div>
        <div class="level-pill" data-level="B2">B2</div>
        <div class="level-pill" data-level="C1">C1</div>
        <div class="level-pill c2" data-level="C2">C2</div>
      </div>

      <div class="pref-row">
        <div class="pref-toggles">
          <label class="toggle-item">
            <input type="checkbox" id="showZhToggle" checked> 顯示中文
          </label>
          <label class="toggle-item">
            <input type="checkbox" id="autoPronounceToggle"> 自動發音
          </label>
        </div>
        <button class="btn-sub" id="historyBtn">📜 歷史 (10)</button>
      </div>
    </div>

    <!-- 總數精簡資訊 -->
    <div class="meta-bar">
      <span id="countSummary">詞庫載入中...</span>
      <span id="quizScoreText" style="display:none;color:#7c3aed;">得分：0 / 0</span>
    </div>

    <!-- 主卡片 -->
    <div class="card">
      <div class="card-top">
        <div class="word-header">
          <h1 class="word-title" id="wordText">---</h1>
          <span class="pos-tag" id="posText"></span>
        </div>

        <div class="zh-word-translation" id="zhWordText">---</div>

        <div class="pron-bar">
          <div class="pron-group">
            <span class="pron-region">UK</span>
            <button class="audio-btn" id="ukAudioBtn" title="英國發音 (按 1)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <span class="ipa" id="ukIpa"></span>
          </div>

          <div class="pron-group">
            <span class="pron-region">US</span>
            <button class="audio-btn" id="usAudioBtn" title="美國發音 (按 2)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
            </button>
            <span class="ipa" id="usIpa"></span>
          </div>
        </div>

        <div id="cefrBadge" class="cefr-badge b2">B2</div>
      </div>

      <!-- 模式一：學習模式 -->
      <div class="learn-view" id="learnView">
        <div class="def-container">
          <div class="definition-en" id="defEnText">---</div>
          <div class="definition-zh" id="defZhText">---</div>
        </div>

        <div class="examples-box">
          <div class="examples-title">Example</div>
          <div id="examplesContainer">---</div>
        </div>
      </div>

      <!-- 模式二：QUIZ MODE (修復 3 選項與中英文) -->
      <div class="quiz-view" id="quizView">
        <div class="quiz-instruction">
          <span>🎯 請選出正確的中英文解釋：</span>
        </div>
        <div class="quiz-options-list" id="quizOptionsContainer"></div>
      </div>
    </div>

    <!-- 底部控制列 -->
    <div class="controls">
      <div class="left-controls">
        <button class="btn btn-quiz-mode" id="toggleQuizBtn">🎮 QUIZ MODE</button>
        <span class="history-indicator" id="historyIndicator">歷程：1 / 1</span>
      </div>

      <div class="nav-group">
        <button class="btn" id="prevBtn" disabled>← 上一個</button>
        <button class="btn btn-primary" id="nextBtn">下一個隨機 🎲 (→)</button>
      </div>
    </div>
  </div>

  <!-- 歷史彈窗 -->
  <div class="modal-overlay" id="historyModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>📜 最近學習記錄（最多 10 個）</span>
        <button style="background:none;border:none;font-size:1.3rem;cursor:pointer;" id="closeModalBtn">&times;</button>
      </div>
      <div class="modal-body" id="historyListContainer"></div>
    </div>
  </div>

  <script>
    const OXFORD_5000_URL = "https://raw.githubusercontent.com/winterdl/oxford-5000-vocabulary-audio-definition/main/data/oxford_5000.json";
    const PREF_KEY = "vocab_app_prefs_v7";

    const c2WordList = [
      { word: "ubiquitous", pos: "adjective", level: "C2", ipa: "/juːˈbɪk.wə.təs/", zh: "無處不在的；普遍存在的", definition: "seeming to be in all places at the same time", zhDef: "似乎無所不在的；十分普遍的", examples: ["Smartphones have become ubiquitous in daily life."] },
      { word: "ephemeral", pos: "adjective", level: "C2", ipa: "/ɪˈfem.ər.əl/", zh: "短暫的；轉瞬即逝的", definition: "lasting for only a very short time", zhDef: "僅持續很短時間的；生命短暫的", examples: ["Fame in the internet age is often ephemeral."] },
      { word: "preposterous", pos: "adjective", level: "C2", ipa: "/prɪˈpɒs.tər.əs/", zh: "荒謬的；反常的", definition: "very silly or stupid; completely unreasonable", zhDef: "荒唐的；極其荒謬無稽的", examples: ["The very idea is preposterous!"] },
      { word: "anecdotal", pos: "adjective", level: "C2", ipa: "/ˌæn.ɪkˈdəʊ.təl/", zh: "軼事的；道聽途說的", definition: "based on personal stories rather than research", zhDef: "基於個人傳聞而非科學依據的", examples: ["Anecdotal evidence suggests that the drug works."] },
      { word: "capricious", pos: "adjective", level: "C2", ipa: "/kəˈprɪʃ.əs/", zh: "反覆無常的；善變的", definition: "changing mood or behaviour suddenly and unexpectedly", zhDef: "脾氣或行為變化莫測的", examples: ["the capricious nature of the stock market"] },
      { word: "taciturn", pos: "adjective", level: "C2", ipa: "/ˈtæs.ɪ.tɜːn/", zh: "沉默寡言的", definition: "tending not to speak much; quiet", zhDef: "不愛說話的；安靜的", examples: ["He was a taciturn man who rarely shared thoughts."] },
      { word: "serendipity", pos: "noun", level: "C2", ipa: "/ˌser.ənˈdɪp.ə.ti/", zh: "意外收穫；機緣巧合", definition: "the fact of finding valuable things by chance", zhDef: "偶然發現珍貴事物的好運氣", examples: ["Finding this café was pure serendipity."] }
    ];

    const fallbackWords = [
      { word: "violent", pos: "adjective", level: "B2", ipa: "/ˈvaɪələnt/", zh: "暴力的；猛烈的", definition: "involving violence; showing great force", zhDef: "涉及暴力的；強烈狂暴的", examples: ["a victim of violent crime"] },
      { word: "attractive", pos: "adjective", level: "A2", ipa: "/əˈtræk.tɪv/", zh: "有吸引力的；動人的", definition: "pleasant to look at; causing interest", zhDef: "悅目的；引起興趣的", examples: ["an attractive woman/man"] },
      { word: "slender", pos: "adjective", level: "C1", ipa: "/ˈslen.dər/", zh: "纖細的；修長的", definition: "thin and delicate, often attractive", zhDef: "修長苗條的；清秀纖細的", examples: ["She had a slender figure."] }
    ];

    let fullDataset = [];
    let filteredDataset = [];
    const translationCache = {};

    let historyQueue = [];
    let historyPointer = -1;

    let isQuizMode = false;
    let quizAnswered = false;
    let quizStats = { total: 0, correct: 0 };
    let currentQuizItem = null;

    let userPrefs = {
      selectedLevels: ["ALL"],
      showZh: true,
      autoPronounce: false
    };

    function loadUserPreferences() {
      try {
        const saved = localStorage.getItem(PREF_KEY);
        if (saved) userPrefs = Object.assign(userPrefs, JSON.parse(saved));
      } catch (e) {}

      document.getElementById("showZhToggle").checked = userPrefs.showZh;
      document.getElementById("autoPronounceToggle").checked = userPrefs.autoPronounce;

      document.querySelectorAll(".level-pill").forEach(pill => {
        const lvl = pill.dataset.level;
        if (userPrefs.selectedLevels.includes(lvl)) pill.classList.add("active");
        else pill.classList.remove("active");
      });
    }

    function saveUserPreferences() {
      try {
        userPrefs.showZh = document.getElementById("showZhToggle").checked;
        userPrefs.autoPronounce = document.getElementById("autoPronounceToggle").checked;
        localStorage.setItem(PREF_KEY, JSON.stringify(userPrefs));
      } catch (e) {}
    }

    // 雙軌即時翻譯
    async function translateText(text) {
      if (!text || typeof text !== "string") return "";
      const clean = text.trim();
      if (!clean || clean === "NaN" || clean === "null") return "";
      if (translationCache[clean]) return translationCache[clean];

      // Google GTX
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=${encodeURIComponent(clean)}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          const trans = data[0].map(item => item[0]).join('').trim();
          if (trans) {
            translationCache[clean] = trans;
            return trans;
          }
        }
      } catch (e) {}

      // MyMemory API 備援
      try {
        const url2 = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean.slice(0, 100))}&langpair=en|zh-TW`;
        const res2 = await fetch(url2);
        if (res2.ok) {
          const data2 = await res2.json();
          if (data2.responseData?.translatedText) {
            const trans = data2.responseData.translatedText.trim();
            translationCache[clean] = trans;
            return trans;
          }
        }
      } catch (e) {}

      return "";
    }

    function sanitizeString(str) {
      if (!str || typeof str !== "string") return "";
      const s = str.trim();
      if (s === "NaN" || s === "null" || s === "undefined" || s === "None" || s.toLowerCase().includes("no definition")) {
        return "";
      }
      return s;
    }

    function normalizeItem(raw) {
      const word = sanitizeString(raw.Spelling || raw.spelling || raw.word || raw.headword);
      const pos = sanitizeString(raw.pos || raw["word type"] || raw.type);
      const level = (sanitizeString(raw.cefr || raw.CEFR || raw.level) || "B2").toUpperCase();
      const ipa = sanitizeString(raw["Lexical spelling"] || raw.ipa || raw.pronunciation);
      const def = sanitizeString(raw.Meaning || raw.meaning || raw.definition || raw.def);
      
      let ex = raw.Example || raw.example || raw.examples || [];
      if (typeof ex === 'string') ex = ex ? [ex] : [];
      if (!Array.isArray(ex) || ex.length === 0) ex = ["(No example sentence provided)"];

      return {
        word: word,
        pos: pos,
        level: level,
        ipa: ipa,
        definition: def,
        zh: raw.zh || "",
        zhDef: raw.zhDef || "",
        examples: ex
      };
    }

    async function initVocabulary() {
      loadUserPreferences();

      try {
        const res = await fetch(OXFORD_5000_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const rawData = await res.json();
        const rawList = Array.isArray(rawData) ? rawData : Object.values(rawData);
        
        // 核心修復：強制過濾掉定義小於 5 個字的無效詞彙，確保庫內每一個詞均有真實解釋
        const oxfordWords = rawList
          .map(normalizeItem)
          .filter(w => w.word.length > 0 && w.definition.length > 5);

        fullDataset = [...c2WordList, ...oxfordWords];
      } catch (err) {
        fullDataset = [...c2WordList, ...fallbackWords];
      }

      applyFilters();
      drawRandomNextWord();
    }

    function applyFilters() {
      const activeLevels = userPrefs.selectedLevels;

      if (activeLevels.includes("ALL") || activeLevels.length === 0) {
        filteredDataset = [...fullDataset];
      } else {
        filteredDataset = fullDataset.filter(item => {
          return activeLevels.some(lvl => item.level.includes(lvl));
        });
      }

      document.getElementById("countSummary").textContent = 
        `詞庫總數：${fullDataset.length.toLocaleString()} 字（符合條件：${filteredDataset.length.toLocaleString()} 字）`;
    }

    function drawRandomNextWord() {
      if (filteredDataset.length === 0) return;

      const randomIdx = Math.floor(Math.random() * filteredDataset.length);
      const chosenWord = filteredDataset[randomIdx];

      if (isQuizMode) {
        generateQuiz(chosenWord);
      } else {
        if (historyPointer < historyQueue.length - 1) {
          historyQueue = historyQueue.slice(0, historyPointer + 1);
        }
        historyQueue.push(chosenWord);
        historyPointer = historyQueue.length - 1;
        renderCard(chosenWord);
      }
    }

    function goBackHistory() {
      if (historyPointer > 0 && !isQuizMode) {
        historyPointer--;
        renderCard(historyQueue[historyPointer]);
      }
    }

    async function renderCard(item) {
      if (!item) return;

      document.getElementById("wordText").textContent = item.word;
      document.getElementById("posText").textContent = item.pos;
      document.getElementById("ukIpa").textContent = item.ipa;
      document.getElementById("usIpa").textContent = item.ipa;

      const badge = document.getElementById("cefrBadge");
      badge.textContent = item.level;
      badge.className = `cefr-badge ${item.level.toLowerCase()}`;

      document.getElementById("defEnText").textContent = item.definition;

      const container = document.getElementById("examplesContainer");
      container.innerHTML = item.examples.map(ex => `<div class="example-item">• ${ex}</div>`).join("");

      document.getElementById("prevBtn").disabled = historyPointer <= 0;
      document.getElementById("historyIndicator").textContent = 
        `歷程：${historyPointer + 1} / ${historyQueue.length}`;

      updateChineseTranslations(item);

      if (document.getElementById("autoPronounceToggle").checked) {
        speak(item.word, "en-GB");
      }
    }

    // 核心修復：QUIZ MODE 確保 3 個選項完全合法且中英文雙全
    async function generateQuiz(targetWord) {
      currentQuizItem = targetWord;
      quizAnswered = false;

      document.getElementById("wordText").textContent = targetWord.word;
      document.getElementById("posText").textContent = targetWord.pos;
      document.getElementById("ukIpa").textContent = targetWord.ipa;
      document.getElementById("usIpa").textContent = targetWord.ipa;

      const badge = document.getElementById("cefrBadge");
      badge.textContent = targetWord.level;
      badge.className = `cefr-badge ${targetWord.level.toLowerCase()}`;

      document.getElementById("zhWordText").style.display = "none";

      // 只從具有完整定義的字庫中挑選 2 個干擾項
      const pool = (filteredDataset.length >= 3 ? filteredDataset : fullDataset)
        .filter(w => w.definition && w.definition.length > 5);

      const distractors = [];
      while (distractors.length < 2) {
        const rand = pool[Math.floor(Math.random() * pool.length)];
        if (rand && rand.word !== targetWord.word && !distractors.some(d => d.word === rand.word)) {
          distractors.push(rand);
        }
      }

      // 嚴格三選一：正確取值 targetWord, distractors[0], distractors
      const options = [
        { isCorrect: true, item: targetWord },
        { isCorrect: false, item: distractors[0] },
        { isCorrect: false, item: distractors }
      ].sort(() => Math.random() - 0.5);

      const letters = ["A", "B", "C"];
      const container = document.getElementById("quizOptionsContainer");
      container.innerHTML = "";

      options.forEach((opt, idx) => {
        const card = document.createElement("div");
        card.className = "quiz-option-card";
        card.dataset.correct = opt.isCorrect ? "true" : "false";

        card.innerHTML = `
          <div class="option-letter">${letters[idx]}</div>
          <div class="option-content">
            <div class="option-en">${opt.item.definition}</div>
            <div class="option-zh">中文翻譯中...</div>
          </div>
        `;

        const zhEl = card.querySelector(".option-zh");

        // 中文保證載入邏輯：優先使用快取，無快取則即時雙向翻譯
        const resolveZh = async () => {
          let wordZh = opt.item.zh;
          if (!wordZh) {
            wordZh = await translateText(opt.item.word);
            opt.item.zh = wordZh;
          }

          let defZh = opt.item.zhDef;
          if (!defZh) {
            defZh = await translateText(opt.item.definition);
            opt.item.zhDef = defZh;
          }

          if (wordZh && defZh) {
            zhEl.textContent = `【${wordZh}】${defZh}`;
          } else if (defZh) {
            zhEl.textContent = defZh;
          } else if (wordZh) {
            zhEl.textContent = `【中文意思】${wordZh}`;
          } else {
            zhEl.textContent = `【中文意思】${opt.item.word}`;
          }
        };

        resolveZh();

        card.addEventListener("click", () => handleQuizSelection(card, opt.isCorrect));
        container.appendChild(card);
      });

      if (document.getElementById("autoPronounceToggle").checked) {
        speak(targetWord.word, "en-GB");
      }
    }

    function handleQuizSelection(selectedCard, isCorrect) {
      if (quizAnswered) return;
      quizAnswered = true;

      quizStats.total++;
      if (isCorrect) quizStats.correct++;

      const scoreText = document.getElementById("quizScoreText");
      scoreText.style.display = "inline";
      scoreText.textContent = `得分：${quizStats.correct} / ${quizStats.total}`;

      const allCards = document.querySelectorAll(".quiz-option-card");
      allCards.forEach(card => {
        card.classList.add("locked");
        if (card.dataset.correct === "true") {
          card.classList.add("correct");
        }
      });

      if (!isCorrect) {
        selectedCard.classList.add("wrong");
      }
    }

    // 模式切換
    document.getElementById("toggleQuizBtn").addEventListener("click", () => {
      isQuizMode = !isQuizMode;

      const toggleBtn = document.getElementById("toggleQuizBtn");
      const learnView = document.getElementById("learnView");
      const quizView = document.getElementById("quizView");
      const prevBtn = document.getElementById("prevBtn");
      const historyIndicator = document.getElementById("historyIndicator");
      const scoreText = document.getElementById("quizScoreText");

      if (isQuizMode) {
        toggleBtn.textContent = "📖 學習模式";
        toggleBtn.style.background = "#0284c7";
        toggleBtn.style.borderColor = "#0284c7";

        learnView.style.display = "none";
        quizView.style.display = "flex";

        prevBtn.style.display = "none";
        historyIndicator.textContent = "🎮 測驗進行中";
        scoreText.style.display = "inline";

        drawRandomNextWord();
      } else {
        toggleBtn.textContent = "🎮 QUIZ MODE";
        toggleBtn.style.background = "#7c3aed";
        toggleBtn.style.borderColor = "#7c3aed";

        learnView.style.display = "flex";
        quizView.style.display = "none";

        prevBtn.style.display = "inline-flex";
        scoreText.style.display = "none";

        if (historyQueue[historyPointer]) {
          renderCard(historyQueue[historyPointer]);
        }
      }
    });

    async function updateChineseTranslations(item) {
      const showZh = document.getElementById("showZhToggle").checked;
      const zhWordEl = document.getElementById("zhWordText");
      const defZhEl = document.getElementById("defZhText");

      if (!showZh || isQuizMode) {
        zhWordEl.style.display = "none";
        defZhEl.style.display = "none";
        return;
      }

      zhWordEl.style.display = "block";
      defZhEl.style.display = "block";

      if (item.zh) {
        zhWordEl.textContent = `【中文】${item.zh}`;
      } else {
        zhWordEl.textContent = "【中文】查詢中...";
        translateText(item.word).then(trans => {
          item.zh = trans;
          zhWordEl.textContent = trans ? `【中文】${trans}` : "";
        });
      }

      if (item.zhDef) {
        defZhEl.textContent = item.zhDef;
      } else {
        translateText(item.definition).then(trans => {
          item.zhDef = trans;
          defZhEl.textContent = trans;
        });
      }
    }

    function speak(text, lang = "en-GB") {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }

    // 難度點擊切換 (支援多選與全部)
    document.querySelectorAll(".level-pill").forEach(pill => {
      pill.addEventListener("click", () => {
        const level = pill.dataset.level;

        if (level === "ALL") {
          userPrefs.selectedLevels = ["ALL"];
          document.querySelectorAll(".level-pill").forEach(p => p.classList.remove("active"));
          pill.classList.add("active");
        } else {
          userPrefs.selectedLevels = userPrefs.selectedLevels.filter(l => l !== "ALL");
          document.querySelector('.level-pill[data-level="ALL"]').classList.remove("active");

          if (userPrefs.selectedLevels.includes(level)) {
            userPrefs.selectedLevels = userPrefs.selectedLevels.filter(l => l !== level);
            pill.classList.remove("active");
          } else {
            userPrefs.selectedLevels.push(level);
            pill.classList.add("active");
          }

          if (userPrefs.selectedLevels.length === 0) {
            userPrefs.selectedLevels = ["ALL"];
            document.querySelector('.level-pill[data-level="ALL"]').classList.add("active");
          }
        }

        saveUserPreferences();
        applyFilters();
        drawRandomNextWord();
      });
    });

    document.getElementById("showZhToggle").addEventListener("change", () => {
      if (!isQuizMode && historyQueue[historyPointer]) {
        updateChineseTranslations(historyQueue[historyPointer]);
      }
      saveUserPreferences();
    });

    document.getElementById("autoPronounceToggle").addEventListener("change", saveUserPreferences);

    document.getElementById("ukAudioBtn").addEventListener("click", () => {
      const w = isQuizMode ? currentQuizItem?.word : historyQueue[historyPointer]?.word;
      if (w) speak(w, "en-GB");
    });

    document.getElementById("usAudioBtn").addEventListener("click", () => {
      const w = isQuizMode ? currentQuizItem?.word : historyQueue[historyPointer]?.word;
      if (w) speak(w, "en-US");
    });

    document.getElementById("nextBtn").addEventListener("click", drawRandomNextWord);
    document.getElementById("prevBtn").addEventListener("click", goBackHistory);

    // 歷史記錄彈窗
    const historyModal = document.getElementById("historyModal");
    const historyBtn = document.getElementById("historyBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const historyListContainer = document.getElementById("historyListContainer");

    historyBtn.addEventListener("click", () => {
      const recentWords = [...historyQueue].reverse().slice(0, 10);
      historyListContainer.innerHTML = "";

      if (recentWords.length === 0) {
        historyListContainer.innerHTML = "<div style='color:var(--text-muted);text-align:center;padding:1rem;'>暫無學習歷史</div>";
      } else {
        recentWords.forEach(item => {
          const div = document.createElement("div");
          div.className = "history-item";
          div.innerHTML = `
            <div>
              <span style="font-weight:700;color:var(--primary);">${item.word}</span>
              <span style="font-size:0.8rem;color:var(--text-muted);font-style:italic;margin-left:4px;">${item.pos}</span>
            </div>
            <span style="font-size:0.85rem;color:#047857;font-weight:600;">${item.zh || "查看"}</span>
          `;
          div.addEventListener("click", () => {
            if (isQuizMode) document.getElementById("toggleQuizBtn").click();
            const targetIdx = historyQueue.lastIndexOf(item);
            if (targetIdx !== -1) {
              historyPointer = targetIdx;
              renderCard(historyQueue[historyPointer]);
            }
            historyModal.classList.remove("open");
          });
          historyListContainer.appendChild(div);
        });
      }

      historyModal.classList.add("open");
    });

    closeModalBtn.addEventListener("click", () => historyModal.classList.remove("open"));
    historyModal.addEventListener("click", (e) => {
      if (e.target === historyModal) historyModal.classList.remove("open");
    });

    // 鍵盤快速鍵 (← 上一個 / → 下一個 / 1 英音 / 2 美音)
    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;
      if (e.key === "ArrowLeft") {
        goBackHistory();
      } else if (e.key === "ArrowRight") {
        drawRandomNextWord();
      } else if (e.key === " " || e.key === "1") {
        e.preventDefault();
        const w = isQuizMode ? currentQuizItem?.word : historyQueue[historyPointer]?.word;
        if (w) speak(w, "en-GB");
      } else if (e.key === "2") {
        e.preventDefault();
        const w = isQuizMode ? currentQuizItem?.word : historyQueue[historyPointer]?.word;
        if (w) speak(w, "en-US");
      }
    });

    initVocabulary();
  </script>
</body>
</html>
