<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Vocab Learner - Oxford & Cambridge</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent-blue: #2563eb;
      --accent-green: #059669;
      --accent-green-bg: #ecfdf5;
      --accent-green-border: #a7f3d0;
      --accent-purple: #7c3aed;
      --accent-gold: #f59e0b;
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    html, body {
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
    }

    /* 核心修復：加入手機 Safe Area 與上下寬裕邊距，防止貼邊 */
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      padding-top: max(1.2rem, env(safe-area-inset-top));
      padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
      padding-left: max(0.8rem, env(safe-area-inset-left));
      padding-right: max(0.8rem, env(safe-area-inset-right));
    }

    .container {
      width: 100%;
      max-width: 500px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 0.55rem;
    }

    /* 頂部難度選擇 Panel */
    .filter-panel {
      background: #fff;
      padding: 0.65rem 0.8rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      flex-shrink: 0;
      margin-top: 0.2rem;
    }

    .pill-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.25rem;
      width: 100%;
    }

    .level-pill {
      text-align: center;
      padding: 0.42rem 0;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 0.82rem;
      font-weight: 700;
      color: #475569;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .level-pill:hover {
      background: #e2e8f0;
    }

    .level-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .level-pill.c2.active {
      background: var(--accent-purple);
      border-color: var(--accent-purple);
    }

    .pref-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #f1f5f9;
      padding-top: 0.35rem;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .toggles-group {
      display: flex;
      gap: 0.65rem;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      cursor: pointer;
      user-select: none;
      font-size: 0.78rem;
    }

    .top-actions-group {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .history-btn {
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 0.22rem 0.6rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--primary);
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .history-btn:hover {
      background: #e2e8f0;
    }

    .mistake-btn {
      background: #f8fafc;
      border: 1px solid var(--border);
      padding: 0.22rem 0.65rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-muted);
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .mistake-btn.has-items {
      background: #fffbeb;
      border-color: #fde68a;
      color: #b45309;
    }

    .mistake-btn:hover {
      background: #fef3c7;
    }

    /* 總數資訊 */
    .count-info {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-muted);
      padding: 0 0.2rem;
      flex-shrink: 0;
      display: flex;
      justify-content: space-between;
    }

    /* 單字主卡片 */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 1.25rem 1.4rem;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      gap: 0.75rem;
      min-height: 0;
      overflow-y: auto;
    }

    .word-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
    }

    .word-main {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .word-title {
      font-size: 2.1rem;
      font-weight: 800;
      color: var(--primary);
      letter-spacing: -0.5px;
      line-height: 1.1;
    }

    .pos-tag {
      font-style: italic;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.55rem;
    }

    .star-btn {
      background: none;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 3px;
      border-radius: 50%;
      transition: transform 0.15s ease;
    }

    .star-btn:hover {
      transform: scale(1.18);
    }

    .cefr-badge {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 800;
    }

    .cefr-badge.c2 { background: #fae8ff; color: #7e22ce; }
    .cefr-badge.c1 { background: #f3e8ff; color: #6b21a8; }
    .cefr-badge.b2, .cefr-badge.b1 { background: #e0f2fe; color: #0369a1; }
    .cefr-badge.a2, .cefr-badge.a1 { background: #dcfce7; color: #15803d; }

    .zh-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
      background: var(--accent-green-bg);
      color: var(--accent-green);
      border: 1px solid var(--accent-green-border);
      padding: 0.25rem 0.65rem;
      border-radius: 8px;
      font-size: 1.05rem;
      font-weight: 700;
      width: fit-content;
    }

    .audio-strip {
      display: flex;
      align-items: center;
      gap: 1.25rem;
      padding-bottom: 0.65rem;
      border-bottom: 1.5px solid #f1f5f9;
    }

    .pron-item {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .accent-tag {
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--accent-blue);
    }

    .audio-play-btn {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: var(--accent-blue);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      transition: all 0.15s;
    }

    .audio-play-btn:hover {
      background: #dbeafe;
      transform: scale(1.08);
    }

    .ipa-text {
      font-family: "Lucida Sans Unicode", "DejaVu Sans", Arial, sans-serif;
      font-size: 0.9rem;
      color: #334155;
    }

    .def-block {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }

    .def-en {
      font-size: 1.08rem;
      font-weight: 600;
      line-height: 1.45;
      color: #1e293b;
    }

    .def-zh {
      font-size: 0.96rem;
      color: #475569;
      line-height: 1.4;
      font-weight: 500;
    }

    .example-wrap {
      background: #f8fafc;
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border-left: 3px solid var(--accent-blue);
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .example-header {
      font-size: 0.72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
    }

    .example-text {
      font-size: 0.94rem;
      line-height: 1.45;
      color: #334155;
    }

    /* QUIZ MODE 專屬區域 */
    .quiz-body {
      display: none;
      flex-direction: column;
      gap: 0.65rem;
      width: 100%;
    }

    .quiz-title-row {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--primary);
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .quiz-card {
      padding: 0.75rem 0.9rem;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: #f8fafc;
      cursor: pointer;
      display: flex;
      gap: 0.7rem;
      align-items: flex-start;
      transition: all 0.15s;
    }

    .quiz-card:hover:not(.locked) {
      background: #eff6ff;
      border-color: var(--accent-blue);
    }

    .quiz-letter {
      background: #e2e8f0;
      color: var(--primary);
      font-weight: 800;
      font-size: 0.8rem;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .quiz-desc {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .quiz-en {
      font-size: 0.92rem;
      font-weight: 600;
      color: #1e293b;
      line-height: 1.35;
    }

    .quiz-zh {
      font-size: 0.85rem;
      color: var(--accent-green);
      font-weight: 600;
      line-height: 1.3;
    }

    .quiz-card.correct {
      background: #ecfdf5 !important;
      border-color: #10b981 !important;
    }
    .quiz-card.correct .quiz-letter {
      background: #10b981;
      color: #fff;
    }

    .quiz-card.wrong {
      background: #fef2f2 !important;
      border-color: #ef4444 !important;
    }
    .quiz-card.wrong .quiz-letter {
      background: #ef4444;
      color: #fff;
    }

    .quiz-card.locked { cursor: default; }

    /* 底部控制列：加入 margin-bottom 預留舒適點擊區域 */
    .bottom-bar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      width: 100%;
      flex-shrink: 0;
      margin-bottom: 0.4rem;
    }

    .btn-action {
      height: 46px;
      padding: 0 1.1rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      transition: all 0.15s;
    }

    .btn-quiz {
      background: #7c3aed;
      color: #fff;
      border-color: #7c3aed;
      min-width: 105px;
    }

    .btn-quiz:hover { background: #6d28d9; }

    .btn-next {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      flex: 1;
    }

    .btn-next:hover { background: #1e293b; }

    /* 通用彈窗樣式 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(2px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1rem;
    }
    .modal-overlay.open { display: flex; }
    .modal-card {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 460px;
      max-height: 72vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }
    .modal-header {
      padding: 0.9rem 1.15rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
    }
    .modal-body {
      padding: 0.75rem 1.15rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      flex: 1;
    }
    .list-item-card {
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.15s;
    }
    .list-item-card:hover { background: #eff6ff; }
    .item-word-info {
      display: flex;
      align-items: baseline;
      gap: 0.4rem;
    }
    .delete-item-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1rem;
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
    }
    .delete-item-btn:hover {
      color: #ef4444;
      background: #fee2e2;
    }
    .modal-footer {
      padding: 0.75rem 1.15rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 頂部難度選擇 Panel -->
    <div class="filter-panel">
      <div class="pill-grid">
        <div class="level-pill" data-level="ALL">全部</div>
        <div class="level-pill" data-level="A1">A1</div>
        <div class="level-pill" data-level="A2">A2</div>
        <div class="level-pill" data-level="B1">B1</div>
        <div class="level-pill" data-level="B2">B2</div>
        <div class="level-pill" data-level="C1">C1</div>
        <div class="level-pill c2" data-level="C2">C2</div>
      </div>

      <div class="pref-bar">
        <div class="toggles-group">
          <label class="toggle-label">
            <input type="checkbox" id="showZhToggle" checked> 顯示中文
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="autoPronounceToggle"> 自動發音
          </label>
        </div>

        <!-- 頂部右側操作區 -->
        <div class="top-actions-group">
          <button class="history-btn" id="openHistoryBtn">📜 歷史</button>
          <button class="mistake-btn" id="openMistakeBtn">
            <span id="topStarIcon"></span> 錯題本/收藏 (<span id="mistakeCountBadge">0</span>)
          </button>
        </div>
      </div>
    </div>

    <!-- 總數與得分資訊 -->
    <div class="count-info">
      <span id="countSummary">詞庫載入中...</span>
      <span id="quizScoreText" style="display:none;color:#7c3aed;">得分：0 / 0</span>
    </div>

    <!-- 主卡片 -->
    <div class="card">
      <div class="word-row">
        <div class="word-main">
          <h1 class="word-title" id="wordText">---</h1>
          <span class="pos-tag" id="posText"></span>
        </div>
        <div class="header-actions">
          <button class="star-btn" id="cardStarBtn" title="加入/移出錯題本/收藏"></button>
          <div id="cefrBadge" class="cefr-badge b2">B2</div>
        </div>
      </div>

      <!-- 核心中文詞義膠囊 -->
      <div class="zh-badge" id="zhWordBadge">
        <span id="zhWordText">---</span>
      </div>

      <!-- 發音區 -->
      <div class="audio-strip">
        <div class="pron-item">
          <span class="accent-tag">UK</span>
          <button class="audio-play-btn" id="ukAudioBtn" title="英國發音 (按 1)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </button>
          <span class="ipa-text" id="ukIpa"></span>
        </div>

        <div class="pron-item">
          <span class="accent-tag">US</span>
          <button class="audio-play-btn" id="usAudioBtn" title="美國發音 (按 2)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          </button>
          <span class="ipa-text" id="usIpa"></span>
        </div>
      </div>

      <!-- 模式一：學習模式 -->
      <div id="learnView" style="display:flex; flex-direction:column; gap:0.75rem;">
        <div class="def-block">
          <div class="def-en" id="defEnText">---</div>
          <div class="def-zh" id="defZhText">---</div>
        </div>

        <div class="example-wrap">
          <div class="example-header">Example</div>
          <div id="examplesContainer">---</div>
        </div>
      </div>

      <!-- 模式二：QUIZ MODE -->
      <div class="quiz-body" id="quizView">
        <div class="quiz-title-row">
          <span>🎯 請選出正確的中英文解釋：</span>
        </div>
        <div class="quiz-options" id="quizOptionsContainer"></div>
      </div>
    </div>

    <!-- 底部控制列 -->
    <div class="bottom-bar">
      <button class="btn-action btn-quiz" id="toggleQuizBtn">🎮 QUIZ</button>
      <button class="btn-action btn-next" id="nextBtn">隨機下一個 🎲</button>
    </div>
  </div>

  <!-- 📜 歷史記錄彈窗 (最多 20 個) -->
  <div class="modal-overlay" id="historyModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>📜 最近學習／測驗記錄（最多 20 個）</span>
        <button style="background:none;border:none;font-size:1.3rem;cursor:pointer;" id="closeHistoryBtn">&times;</button>
      </div>
      <div class="modal-body" id="historyListContainer"></div>
      <div class="modal-footer">
        <span style="font-size:0.8rem;color:var(--text-muted);">點擊任何單字即可跳轉複習</span>
        <button id="clearHistoryBtn" style="background:none;border:none;color:var(--text-muted);font-size:0.8rem;cursor:pointer;">清空歷史</button>
      </div>
    </div>
  </div>

  <!-- ⭐ 錯題本/收藏彈窗 -->
  <div class="modal-overlay" id="mistakeModal">
    <div class="modal-card">
      <div class="modal-header">
        <span>⭐ 錯題本 / 收藏</span>
        <button style="background:none;border:none;font-size:1.3rem;cursor:pointer;" id="closeMistakeBtn">&times;</button>
      </div>
      <div class="modal-body" id="mistakeListContainer"></div>
      <div class="modal-footer">
        <span style="font-size:0.8rem;color:var(--text-muted);">答錯自動收錄，點擊可重溫</span>
        <button id="clearAllMistakesBtn" style="background:none;border:none;color:#ef4444;font-size:0.8rem;cursor:pointer;font-weight:600;">清空全部</button>
      </div>
    </div>
  </div>

  <script>
    const OXFORD_5000_URL = "https://raw.githubusercontent.com/winterdl/oxford-5000-vocabulary-audio-definition/main/data/oxford_5000.json";
    const PREF_KEY = "vocab_app_prefs_v16";
    const MISTAKE_STORAGE_KEY = "vocab_app_mistakes_v5";
    const HISTORY_STORAGE_KEY = "vocab_app_history_v2";

    const SVG_HOLLOW_STAR = `
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
    `;

    const SVG_FILLED_STAR = `
      <svg width="22" height="22" viewBox="0 0 24 24" fill="#f59e0b" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
    `;

    const c2WordList = [

      { word: "ephemeral", pos: "adjective", level: "C2", ipa: "/ɪˈfem.ər.əl/", zh: "短暫的；轉瞬即逝", definition: "lasting for only a very short time", zhDef: "僅持續很短時間的；生命短暫的", examples: ["Fame in the internet age is often ephemeral."] },
      { word: "preposterous", pos: "adjective", level: "C2", ipa: "/prɪˈpɒs.tər.əs/", zh: "荒謬的；反常的", definition: "very silly or stupid; completely unreasonable", zhDef: "荒唐的；極其荒謬無稽的", examples: ["The very idea is preposterous!"] },
      { word: "anecdotal", pos: "adjective", level: "C2", ipa: "/ˌæn.ɪkˈdəʊ.təl/", zh: "軼事的；傳聞的", definition: "based on personal stories rather than research", zhDef: "基於個人傳聞而非科學依據的", examples: ["Anecdotal evidence suggests that the drug works."] },
      { word: "capricious", pos: "adjective", level: "C2", ipa: "/kəˈprɪʃ.əs/", zh: "反覆無常的；善變", definition: "changing mood or behaviour suddenly and unexpectedly", zhDef: "脾氣或行為變化莫測的", examples: ["the capricious nature of the stock market"] },
      { word: "taciturn", pos: "adjective", level: "C2", ipa: "/ˈtæs.ɪ.tɜːn/", zh: "沉默寡言的", definition: "tending not to speak much; quiet", zhDef: "不愛說話的；安靜的", examples: ["He was a taciturn man who rarely shared thoughts."] },
      { word: "serendipity", pos: "noun", level: "C2", ipa: "/ˌser.ənˈdɪp.ə.ti/", zh: "機緣巧合；意外收穫", definition: "the fact of finding valuable things by chance", zhDef: "偶然發現珍貴事物的好運氣", examples: ["Finding this café was pure serendipity."] }
    ];

    const fallbackWords = [
      { word: "violent", pos: "adjective", level: "B2", ipa: "/ˈvaɪələnt/", zh: "暴力的；猛烈的", definition: "involving violence; showing great force", zhDef: "涉及暴力的；強烈狂暴的", examples: ["a victim of violent crime"] },
      { word: "attractive", pos: "adjective", level: "A2", ipa: "/əˈtræk.tɪv/", zh: "有吸引力的", definition: "pleasant to look at; causing interest", zhDef: "悅目的；引起興趣的", examples: ["an attractive woman/man"] },
      { word: "slender", pos: "adjective", level: "C1", ipa: "/ˈslen.dər/", zh: "纖細的；修長的", definition: "thin and delicate, often attractive", zhDef: "修長苗條的；清秀纖細的", examples: ["She had a slender figure."] }
    ];

    let fullDataset = [];
    let filteredDataset = [];
    const translationCache = {};

    let currentItem = null;
    let isQuizMode = false;
    let quizAnswered = false;
    let quizStats = { total: 0, correct: 0 };

    let mistakeBook = [];
    let historyList = [];

    let userPrefs = {
      selectedLevels: ["ALL"],
      showZh: true,

    function loadMistakeBook() {
      try {
        const saved = localStorage.getItem(MISTAKE_STORAGE_KEY);
        if (saved) mistakeBook = JSON.parse(saved);
      } catch (e) {
        mistakeBook = [];
      }
      updateMistakeBadge();
    }

    function saveMistakeBook() {
      try {
        localStorage.setItem(MISTAKE_STORAGE_KEY, JSON.stringify(mistakeBook));
      } catch (e) {}
      updateMistakeBadge();
    }

    function loadHistory() {
      try {
        const saved = localStorage.getItem(HISTORY_STORAGE_KEY);
        if (saved) historyList = JSON.parse(saved);
      } catch (e) {
        historyList = [];
      }
    }

    function saveHistory() {
      try {
        localStorage.setItem(HISTORY_STORAGE_KEY, JSON.stringify(historyList));
      } catch (e) {}
    }

    function recordToHistory(wordObj) {
      if (!wordObj || !wordObj.word) return;
      if (historyList.length > 0 && historyList.at(0).word.toLowerCase() === wordObj.word.toLowerCase()) {
        return;
      }
      historyList.unshift(wordObj);
      if (historyList.length > 20) {
        historyList = historyList.slice(0, 20);
      }
      saveHistory();

      if (!wordObj.zh) {
        translateText(wordObj.word).then(trans => {
          wordObj.zh = trans;
          saveHistory();
        });
      }
    }

    function updateMistakeBadge() {
      const badge = document.getElementById("mistakeCountBadge");
      const btn = document.getElementById("openMistakeBtn");
      const topIcon = document.getElementById("topStarIcon");

      badge.textContent = mistakeBook.length;

      if (mistakeBook.length > 0) {

        topIcon.innerHTML = `

            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        `;
      } else {
        btn.classList.remove("has-items");
        topIcon.innerHTML = `
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#94a3b8" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
          </svg>
        `;
      }

      updateCardStarStatus();
    }

    function isCurrentWordInMistakes() {
      if (!currentItem || !currentItem.word) return false;
      return mistakeBook.some(m => m.word.toLowerCase() === currentItem.word.toLowerCase());
    }

    function updateCardStarStatus() {
      const starBtn = document.getElementById("cardStarBtn");
      if (!starBtn) return;

      if (isCurrentWordInMistakes()) {
        starBtn.innerHTML = SVG_FILLED_STAR;
        starBtn.title = "已加入錯題本/收藏 (點擊取消)";
      } else {
        starBtn.innerHTML = SVG_HOLLOW_STAR;
        starBtn.title = "未收藏 (點擊加入錯題本/收藏)";
      }
    }

    function addWordToMistakes(wordObj) {
      if (!wordObj || !wordObj.word) return;
      if (!mistakeBook.some(m => m.word.toLowerCase() === wordObj.word.toLowerCase())) {
        mistakeBook.unshift(wordObj);
        saveMistakeBook();
      }
    }

    function removeWordFromMistakes(wordStr) {
      mistakeBook = mistakeBook.filter(m => m.word.toLowerCase() !== wordStr.toLowerCase());
      saveMistakeBook();
    }

    function loadUserPreferences() {
      try {
        const saved = localStorage.getItem(PREF_KEY);
        if (saved) userPrefs = Object.assign(userPrefs, JSON.parse(saved));
      } catch (e) {}

      document.getElementById("showZhToggle").checked = userPrefs.showZh;
      document.getElementById("autoPronounceToggle").checked = userPrefs.autoPronounce;

      document.querySelectorAll(".level-pill").forEach(pill => {
        const lvl = pill.dataset.level;
        if (userPrefs.selectedLevels.includes(lvl)) pill.classList.add("active");
        else pill.classList.remove("active");
      });
    }

    function saveUserPreferences() {
      try {
        userPrefs.showZh = document.getElementById("showZhToggle").checked;
        userPrefs.autoPronounce = document.getElementById("autoPronounceToggle").checked;
        localStorage.setItem(PREF_KEY, JSON.stringify(userPrefs));
      } catch (e) {}
    }

    async function translateText(text) {
      if (!text || typeof text !== "string") return "";
      const clean = text.trim();
      if (!clean || clean === "NaN" || clean === "null" || clean === "undefined") return "";
      if (translationCache[clean]) return translationCache[clean];

      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=${encodeURIComponent(clean)}`;
        const res = await fetch(url);
        if (res.ok) {
          const data = await res.json();
          const trans = data.at(0).map(item => item.at(0)).join('').trim();
          if (trans) {
            translationCache[clean] = trans;
            return trans;
          }
        }
      } catch (e) {}

      try {
        const url2 = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(clean.slice(0, 100))}&langpair=en|zh-TW`;
        const res2 = await fetch(url2);
        if (res2.ok) {
          const data2 = await res2.json();
          if (data2.responseData?.translatedText) {
            const trans = data2.responseData.translatedText.trim();
            translationCache[clean] = trans;
            return trans;
          }
        }
      } catch (e) {}

      return "";
    }

    function sanitizeString(str) {
      if (!str || typeof str !== "string") return "";
      const s = str.trim();
      if (s === "NaN" || s === "null" || s === "undefined" || s === "None" || s.toLowerCase().includes("no definition")) {
        return "";
      }
      return s;
    }

    function normalizeItem(raw) {
      const word = sanitizeString(raw.Spelling || raw.spelling || raw.word || raw.headword);
      const pos = sanitizeString(raw.pos || raw["word type"] || raw.type);
      const level = (sanitizeString(raw.cefr || raw.CEFR || raw.level) || "B2").toUpperCase();
      const ipa = sanitizeString(raw["Lexical spelling"] || raw.ipa || raw.pronunciation);
      const def = sanitizeString(raw.Meaning || raw.meaning || raw.definition || raw.def);
      
      let ex = raw.Example || raw.example || raw.examples || [];
      if (typeof ex === 'string') ex = ex ? [ex] : [];
      if (!Array.isArray(ex) || ex.length === 0) ex = ["(No example sentence provided)"];

      return {
        word: word,
        pos: pos,
        level: level,
        ipa: ipa,
        definition: def,
        zh: raw.zh || "",
        zhDef: raw.zhDef || "",
        examples: ex
      };
    }

    async function initVocabulary() {
      loadUserPreferences();
      loadMistakeBook();
      loadHistory();

      try {
        const res = await fetch(OXFORD_5000_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const rawData = await res.json();
        const rawList = Array.isArray(rawData) ? rawData : Object.values(rawData);
        
        const oxfordWords = rawList
          .map(normalizeItem)
          .filter(w => w.word && w.word.length > 0 && w.definition && w.definition.length > 5);

        fullDataset = [...c2WordList, ...oxfordWords];
      } catch (err) {
        fullDataset = [...c2WordList, ...fallbackWords];
      }

      applyFilters();
      drawRandomNextWord();
    }

    function applyFilters() {
      const activeLevels = userPrefs.selectedLevels;

      if (activeLevels.includes("ALL") || activeLevels.length === 0) {
        filteredDataset = [...fullDataset];
      } else {
        filteredDataset = fullDataset.filter(item => {
          return activeLevels.some(lvl => item.level.includes(lvl));
        });
      }

      document.getElementById("countSummary").textContent = 
        `詞庫總數：${fullDataset.length.toLocaleString()} 字（符合：${filteredDataset.length.toLocaleString()}）`;
    }

    function drawRandomNextWord() {
      if (filteredDataset.length === 0) return;

      const randomIdx = Math.floor(Math.random() * filteredDataset.length);
      currentItem = filteredDataset.at(randomIdx);

      recordToHistory(currentItem);

      if (isQuizMode) {
        generateQuiz(currentItem);
      } else {
        renderCard(currentItem);
      }

      updateCardStarStatus();
    }

    async function renderCard(item) {
      if (!item) return;

      document.getElementById("wordText").textContent = item.word;
      document.getElementById("posText").textContent = item.pos;
      document.getElementById("ukIpa").textContent = item.ipa;
      document.getElementById("usIpa").textContent = item.ipa;

      const badge = document.getElementById("cefrBadge");
      badge.textContent = item.level;
      badge.className = `cefr-badge ${item.level.toLowerCase()}`;

      document.getElementById("defEnText").textContent = item.definition;

      const container = document.getElementById("examplesContainer");
      container.innerHTML = item.examples.map(ex => `<div class="example-text">• ${ex}</div>`).join("");

      updateChineseTranslations(item);

      if (document.getElementById("autoPronounceToggle").checked) {
        speak(item.word, "en-GB");
      }
    }

    async function generateQuiz(targetWord) {
      quizAnswered = false;

      document.getElementById("wordText").textContent = targetWord.word;
      document.getElementById("posText").textContent = targetWord.pos;
      document.getElementById("ukIpa").textContent = targetWord.ipa;
      document.getElementById("usIpa").textContent = targetWord.ipa;

      const badge = document.getElementById("cefrBadge");
      badge.textContent = targetWord.level;
      badge.className = `cefr-badge ${targetWord.level.toLowerCase()}`;

      document.getElementById("zhWordBadge").style.display = "none";

      const pool = (filteredDataset.length >= 3 ? filteredDataset : fullDataset)
        .filter(w => w && w.word && w.definition && w.definition.length > 5);

      const distractors = [];
      while (distractors.length < 2) {
        const rand = pool.at(Math.floor(Math.random() * pool.length));
        if (rand && rand.word !== targetWord.word && !distractors.some(d => d.word === rand.word)) {
          distractors.push(rand);
        }
      }

      const [distractorA, distractorB] = distractors;
      const safeDistA = distractorA && distractorA.definition ? distractorA : fallbackWords.at(0);
      const safeDistB = distractorB && distractorB.definition ? distractorB : fallbackWords.at(1);

      const options = [
        { isCorrect: true, item: targetWord },
        { isCorrect: false, item: safeDistA },
        { isCorrect: false, item: safeDistB }
      ].sort(() => Math.random() - 0.5);

      const letters = ["A", "B", "C"];
      const container = document.getElementById("quizOptionsContainer");
      container.innerHTML = "";

      options.forEach((opt, idx) => {
        const card = document.createElement("div");
        card.className = "quiz-card";
        card.dataset.correct = opt.isCorrect ? "true" : "false";

        const validItem = opt.item && opt.item.definition ? opt.item : targetWord;

        card.innerHTML = `
          <div class="quiz-letter">${letters.at(idx)}</div>
          <div class="quiz-desc">
            <div class="quiz-en">${validItem.definition}</div>
            <div class="quiz-zh">中文載入中...</div>
          </div>
        `;

        const zhEl = card.querySelector(".quiz-zh");

        const resolveZh = async () => {
          let wordZh = validItem.zh;
          if (!wordZh || wordZh === "undefined") {
            wordZh = await translateText(validItem.word);
            validItem.zh = wordZh;
          }

          let defZh = validItem.zhDef;
          if (!defZh || defZh === "undefined") {
            defZh = await translateText(validItem.definition);
            validItem.zhDef = defZh;
          }

          if (wordZh && defZh) {
            zhEl.textContent = `【${wordZh}】${defZh}`;
          } else if (defZh) {
            zhEl.textContent = defZh;
          } else if (wordZh) {
            zhEl.textContent = `【中文】${wordZh}`;
          } else {
            zhEl.textContent = `【中文】${validItem.word}`;
          }
        };

        resolveZh();

        card.addEventListener("click", () => handleQuizSelection(card, opt.isCorrect));
        container.appendChild(card);
      });

      if (document.getElementById("autoPronounceToggle").checked) {
        speak(targetWord.word, "en-GB");
      }
    }

    function handleQuizSelection(selectedCard, isCorrect) {
      if (quizAnswered) return;
      quizAnswered = true;

      quizStats.total++;
      if (isCorrect) {
        quizStats.correct++;
      } else {
        addWordToMistakes(currentItem);
      }

      const scoreText = document.getElementById("quizScoreText");
      scoreText.style.display = "inline";
      scoreText.textContent = `得分：${quizStats.correct} / ${quizStats.total}`;

      const allCards = document.querySelectorAll(".quiz-card");
      allCards.forEach(card => {
        card.classList.add("locked");
        if (card.dataset.correct === "true") card.classList.add("correct");
      });

      if (!isCorrect) selectedCard.classList.add("wrong");
    }

    document.getElementById("cardStarBtn").addEventListener("click", () => {
      if (!currentItem) return;
      if (isCurrentWordInMistakes()) {
        removeWordFromMistakes(currentItem.word);
      } else {
        addWordToMistakes(currentItem);
      }
    });

    document.getElementById("toggleQuizBtn").addEventListener("click", () => {
      isQuizMode = !isQuizMode;

      const toggleBtn = document.getElementById("toggleQuizBtn");
      const learnView = document.getElementById("learnView");
      const quizView = document.getElementById("quizView");
      const scoreText = document.getElementById("quizScoreText");

      if (isQuizMode) {
        toggleBtn.textContent = "📖 學習";

        quizView.style.display = "none";
        scoreText.style.display = "none";

    async function updateChineseTranslations(item) {
      const showZh = document.getElementById("showZhToggle").checked;
      const zhBadge = document.getElementById("zhWordBadge");
      const zhWordEl = document.getElementById("zhWordText");
      const defZhEl = document.getElementById("defZhText");

      if (!showZh || isQuizMode) {
        zhBadge.style.display = "none";
        defZhEl.style.display = "none";
        return;
      }

      zhBadge.style.display = "inline-flex";
      defZhEl.style.display = "block";

      if (item.zh && item.zh !== "undefined") {
        zhWordEl.textContent = item.zh;
      } else {
        zhWordEl.textContent = "查詢中...";
        translateText(item.word).then(trans => {
          item.zh = trans;
          zhWordEl.textContent = trans || item.word;
        });
      }

      if (item.zhDef && item.zhDef !== "undefined") {
        defZhEl.textContent = item.zhDef;
      } else {
        translateText(item.definition).then(trans => {
          item.zhDef = trans;
          defZhEl.textContent = trans;
        });
      }
    }

    function speak(text, lang = "en-GB") {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }

    document.querySelectorAll(".level-pill").forEach(pill => {
      pill.addEventListener("click", () => {
        const level = pill.dataset.level;

        if (level === "ALL") {
          userPrefs.selectedLevels = ["ALL"];
          document.querySelectorAll(".level-pill").forEach(p => p.classList.remove("active"));
          pill.classList.add("active");
        } else {
          userPrefs.selectedLevels = userPrefs.selectedLevels.filter(l => l !== "ALL");
          document.querySelector('.level-pill[data-level="ALL"]').classList.remove("active");

          if (userPrefs.selectedLevels.includes(level)) {
            userPrefs.selectedLevels = userPrefs.selectedLevels.filter(l => l !== level);
            pill.classList.remove("active");
          } else {
            userPrefs.selectedLevels.push(level);
            pill.classList.add("active");
          }

          if (userPrefs.selectedLevels.length === 0) {
            userPrefs.selectedLevels = ["ALL"];
            document.querySelector('.level-pill[data-level="ALL"]').classList.add("active");
          }
        }

        saveUserPreferences();
        applyFilters();
        drawRandomNextWord();
      });
    });

    document.getElementById("showZhToggle").addEventListener("change", () => {
      if (!isQuizMode && currentItem) updateChineseTranslations(currentItem);
      saveUserPreferences();
    });

    document.getElementById("autoPronounceToggle").addEventListener("change", saveUserPreferences);

    document.getElementById("ukAudioBtn").addEventListener("click", () => {
      if (currentItem) speak(currentItem.word, "en-GB");
    });

    document.getElementById("usAudioBtn").addEventListener("click", () => {
      if (currentItem) speak(currentItem.word, "en-US");

    document.getElementById("nextBtn").addEventListener("click", drawRandomNextWord);

    // 📜 歷史記錄彈窗 (最多 20 個)

    const historyListContainer = document.getElementById("historyListContainer");
    const clearHistoryBtn = document.getElementById("clearHistoryBtn");

    // ⭐ 錯題本/收藏彈窗

    const mistakeListContainer = document.getElementById("mistakeListContainer");

    function renderMistakeModal() {

        return;

        const div = document.createElement("div");

        div.innerHTML = `
          <div class="item-word-info">
            <span style="font-weight:800;color:var(--primary);font-size:1.02rem;">${item.word}</span>
            <span style="font-size:0.8rem;color:var(--text-muted);font-style:italic;">${item.pos}</span>
            <span class="cefr-badge ${item.level.toLowerCase()}" style="padding:0.1rem 0.35rem;font-size:0.7rem;">${item.level}</span>
            <span style="font-size:0.85rem;color:#047857;font-weight:600;margin-left:4px;">${item.zh || ""}</span>
          </div>
          <button class="delete-item-btn" title="移出錯題本/收藏">🗑️</button>
        `;

        div.querySelector(".item-word-info").addEventListener("click", () => {
          if (isQuizMode) document.getElementById("toggleQuizBtn").click();
          currentItem = item;
          renderCard(currentItem);
          updateCardStarStatus();
          mistakeModal.classList.remove("open");
        });

        div.querySelector(".delete-item-btn").addEventListener("click", (e) => {
          e.stopPropagation();
          removeWordFromMistakes(item.word);
          renderMistakeModal();
        });

        mistakeListContainer.appendChild(div);
      });
    }

    openMistakeBtn.addEventListener("click", () => {
      renderMistakeModal();
      mistakeModal.classList.add("open");
    });

    closeMistakeBtn.addEventListener("click", () => mistakeModal.classList.remove("open"));
    mistakeModal.addEventListener("click", (e) => {
      if (e.target === mistakeModal) mistakeModal.classList.remove("open");
    });

    clearAllMistakesBtn.addEventListener("click", () => {
      if (confirm("確定要清空所有錯題/收藏記錄嗎？")) {
        mistakeBook = [];
        saveMistakeBook();
        renderMistakeModal();
      }
    });

    // 鍵盤快速鍵
    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;
      if (e.key === "ArrowRight") {
        drawRandomNextWord();
      } else if (e.key === " " || e.key === "1") {
        e.preventDefault();
        if (currentItem) speak(currentItem.word, "en-GB");
      } else if (e.key === "2") {
        e.preventDefault();
        if (currentItem) speak(currentItem.word, "en-US");
      }
    });

    initVocabulary();
  </script>
</body>
</html>
