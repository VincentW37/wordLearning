<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Vocab Learner</title>
  <style>
    :root {
      --primary: #002147;
      --accent-blue: #0284c7;
      --accent-yellow: #f59e0b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* 鎖定手機視窗高度，避免滾動 */
    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: env(safe-area-inset-top, 8px) 12px env(safe-area-inset-bottom, 8px) 12px;
    }

    .container {
      width: 100%;
      max-width: 540px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* 頂部控制列（緊湊型） */
    .filter-section {
      background: #fff;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex-shrink: 0;
    }

    .filter-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }

    .level-pill {
      padding: 2px 8px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 0.75rem;
      font-weight: 600;
      color: #475569;
      cursor: pointer;
      user-select: none;
    }

    .level-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .level-pill.c2.active {
      background: #6b21a8;
      border-color: #6b21a8;
    }

    .pref-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
      border-top: 1px dashed var(--border);
      padding-top: 5px;
    }

    .toggle-group {
      display: flex;
      gap: 10px;
    }

    .toggle-item {
      display: flex;
      align-items: center;
      gap: 3px;
      cursor: pointer;
    }

    .btn-random {
      padding: 2px 8px;
      font-size: 0.75rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    /* 狀態提示 */
    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.72rem;
      color: var(--text-muted);
      padding: 0 4px;
      flex-shrink: 0;
    }

    /* 單字卡片主體（自適應剩餘空間） */
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 12px 14px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 10px rgba(0, 33, 71, 0.05);
      flex: 1;
      min-height: 0; /* 讓 flex 子元素能正確縮小 */
      display: flex;
      flex-direction: column;
      overflow-y: auto; /* 萬一極長例句仍可微調，但預設不會出現滾動條 */
    }

    .word-header {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .word-title {
      font-size: 1.85rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.1;
      letter-spacing: -0.5px;
    }

    .pos-tag {
      font-style: italic;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .zh-word-translation {
      font-size: 1.05rem;
      font-weight: 600;
      color: #047857;
      margin: 2px 0 6px 0;
    }

    /* 發音區 */
    .pron-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      padding-bottom: 6px;
      border-bottom: 2px solid var(--accent-yellow);
      flex-shrink: 0;
    }

    .pron-group {
      display: flex;
      align-items: center;
      gap: 3px;
    }

    .pron-region {
      font-weight: 700;
      font-size: 0.78rem;
      color: var(--accent-blue);
    }

    .ipa {
      font-family: "Lucida Sans Unicode", "DejaVu Sans", Arial, sans-serif;
      font-size: 0.85rem;
      color: #334155;
    }

    .audio-btn {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      cursor: pointer;
      color: var(--accent-blue);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      border-radius: 50%;
    }

    .cefr-badge {
      display: inline-block;
      padding: 1px 5px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      margin-bottom: 6px;
      width: fit-content;
      flex-shrink: 0;
    }

    .cefr-badge.c2 { background: #fae8ff; color: #6b21a8; }
    .cefr-badge.c1 { background: #f3e8ff; color: #7e22ce; }
    .cefr-badge.b2, .cefr-badge.b1 { background: #e0f2fe; color: #0369a1; }
    .cefr-badge.a2, .cefr-badge.a1 { background: #dcfce7; color: #15803d; }

    /* 釋義 */
    .def-container {
      margin-bottom: 8px;
    }

    .definition-en {
      font-size: 0.95rem;
      font-weight: 600;
      line-height: 1.35;
      color: #1e293b;
      margin-bottom: 2px;
    }

    .definition-zh {
      font-size: 0.88rem;
      color: #475569;
      line-height: 1.3;
    }

    /* 例句 */
    .examples-box {
      margin-top: auto;
      background: #f8fafc;
      padding: 8px 10px;
      border-radius: 8px;
      border-left: 3px solid var(--accent-blue);
      flex-shrink: 0;
    }

    .examples-title {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 3px;
    }

    .example-item {
      font-size: 0.86rem;
      line-height: 1.35;
      color: #334155;
      margin-bottom: 2px;
    }

    .example-item:last-child {
      margin-bottom: 0;
    }

    /* 底部導覽列（常駐一屏底部） */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      flex-shrink: 0;
    }

    .counter {
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    .nav-group {
      display: flex;
      gap: 6px;
    }

    .nav-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: #fff;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-btn.primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
  </style>
</head>
<body>

  <div class="container" id="appContainer">
    <!-- 頂部多選與設定 -->
    <div class="filter-section">
      <div class="filter-row">
        <div class="level-pill" data-level="ALL">全部</div>
        <div class="level-pill" data-level="A1">A1</div>
        <div class="level-pill" data-level="A2">A2</div>
        <div class="level-pill" data-level="B1">B1</div>
        <div class="level-pill" data-level="B2">B2</div>
        <div class="level-pill" data-level="C1">C1</div>
        <div class="level-pill c2" data-level="C2">C2</div>
      </div>

      <div class="pref-row">
        <div class="toggle-group">
          <label class="toggle-item">
            <input type="checkbox" id="showZhToggle" checked> 中文
          </label>
          <label class="toggle-item">
            <input type="checkbox" id="autoPronounceToggle"> 自動發音
          </label>
        </div>
        <button class="btn-random" id="randomBtn">隨機抽字</button>
      </div>
    </div>

    <!-- 狀態列 -->
    <div class="status-bar">
      <span id="loadStatus">載入詞庫中...</span>
      <span id="poolStatus">---</span>
    </div>

    <!-- 主單字卡片（支援觸控滑動切換） -->
    <div class="card" id="touchCard">
      <div class="word-header">
        <h1 class="word-title" id="wordText">---</h1>
        <span class="pos-tag" id="posText"></span>
      </div>

      <div class="zh-word-translation" id="zhWordText">---</div>

      <div class="pron-bar">
        <div class="pron-group">
          <span class="pron-region">UK</span>
          <button class="audio-btn" id="ukAudioBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
          </button>
          <span class="ipa" id="ukIpa"></span>
        </div>

        <div class="pron-group">
          <span class="pron-region">US</span>
          <button class="audio-btn" id="usAudioBtn">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
          </button>
          <span class="ipa" id="usIpa"></span>
        </div>
      </div>

      <div id="cefrBadge" class="cefr-badge b2">B2</div>

      <div class="def-container">
        <div class="definition-en" id="defEnText">---</div>
        <div class="definition-zh" id="defZhText">---</div>
      </div>

      <div class="examples-box">
        <div class="examples-title">Example</div>
        <div id="examplesContainer">---</div>
      </div>
    </div>

    <!-- 底部控制按鈕（不需向下滑動即時按到） -->
    <div class="controls">
      <span class="counter" id="counterText">0 / 0</span>
      <div class="nav-group">
        <button class="nav-btn" id="prevBtn">上一個</button>
        <button class="nav-btn primary" id="nextBtn">下一個</button>
      </div>
    </div>
  </div>

  <script>
    const OXFORD_5000_URL = "https://raw.githubusercontent.com/winterdl/oxford-5000-vocabulary-audio-definition/main/data/oxford_5000.json";
    const PREF_KEY = "vocab_app_prefs_compact";

    const c2WordList = [
      {
        word: "ubiquitous",
        pos: "adjective",
        level: "C2",
        ipa: "/juːˈbɪk.wə.təs/",
        zh: "無處不在的；普遍存在的",
        definition: "seeming to be in all places at the same time:",
        zhDef: "似乎無所不在的；十分普遍的",
        examples: ["Smartphones have become ubiquitous in daily life."]
      },
      {
        word: "preposterous",
        pos: "adjective",
        level: "C2",
        ipa: "/prɪˈpɒs.tər.əs/",
        zh: "荒謬的；反常的",
        definition: "very silly or stupid; completely unreasonable:",
        zhDef: "荒唐的；極其荒謬無稽的",
        examples: ["The very idea is preposterous!"]
      },
      {
        word: "ephemeral",
        pos: "adjective",
        level: "C2",
        ipa: "/ɪˈfem.ər.əl/",
        zh: "短暫的；轉瞬即逝的",
        definition: "lasting for only a short time:",
        zhDef: "僅持續很短時間的；短暫的",
        examples: ["Fame in the internet age is often ephemeral."]
      }
    ];

    let fullDataset = [];
    let filteredDataset = [];
    let currentIndex = 0;
    const translationCache = {};

    let userPrefs = {
      selectedLevels: ["ALL"],
      showZh: true,
      autoPronounce: false,
      lastWord: ""
    };

    function loadUserPreferences() {
      try {
        const saved = localStorage.getItem(PREF_KEY);
        if (saved) userPrefs = Object.assign(userPrefs, JSON.parse(saved));
      } catch (e) {}

      document.getElementById("showZhToggle").checked = userPrefs.showZh;
      document.getElementById("autoPronounceToggle").checked = userPrefs.autoPronounce;

      document.querySelectorAll(".level-pill").forEach(pill => {
        const lvl = pill.dataset.level;
        if (userPrefs.selectedLevels.includes(lvl)) pill.classList.add("active");
        else pill.classList.remove("active");
      });
    }

    function saveUserPreferences() {
      try {
        if (filteredDataset[currentIndex]) userPrefs.lastWord = filteredDataset[currentIndex].word;
        userPrefs.showZh = document.getElementById("showZhToggle").checked;
        userPrefs.autoPronounce = document.getElementById("autoPronounceToggle").checked;
        localStorage.setItem(PREF_KEY, JSON.stringify(userPrefs));
      } catch (e) {}
    }

    async function translateToZh(text) {
      if (!text) return "";
      if (translationCache[text]) return translationCache[text];
      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        const translated = data[0].map(item => item[0]).join('');
        translationCache[text] = translated;
        return translated;
      } catch (err) {
        return "";
      }
    }

    function normalizeItem(raw) {
      const word = raw.Spelling || raw.spelling || raw.word || raw.headword || "";
      const pos = raw.pos || raw["word type"] || raw.type || "";
      const level = (raw.cefr || raw.CEFR || raw.level || "B2").toUpperCase();
      const ipa = raw["Lexical spelling"] || raw.ipa || raw.pronunciation || "";
      const def = raw.Meaning || raw.meaning || raw.definition || raw.def || "";
      let ex = raw.Example || raw.example || raw.examples || [];
      if (typeof ex === 'string') ex = ex ? [ex] : [];
      if (!Array.isArray(ex) || ex.length === 0) ex = ["(No example)"];

      return {
        word: word.trim(),
        pos: pos.trim(),
        level: level.trim(),
        ipa: ipa.trim(),
        definition: def.trim(),
        zh: raw.zh || "",
        zhDef: raw.zhDef || "",
        examples: ex
      };
    }

    async function initVocabulary() {
      loadUserPreferences();
      try {
        const res = await fetch(OXFORD_5000_URL);
        const rawData = await res.json();
        const rawList = Array.isArray(rawData) ? rawData : Object.values(rawData);
        const oxfordWords = rawList.map(normalizeItem).filter(w => w.word.length > 0);
        fullDataset = [...c2WordList, ...oxfordWords];
        document.getElementById("loadStatus").textContent = `全量詞庫 (${fullDataset.length} 字)`;
      } catch (err) {
        fullDataset = [...c2WordList];
        document.getElementById("loadStatus").textContent = `離線庫模式`;
      }
      applyFilters(true);
    }

    function applyFilters(isFirstLoad = false) {
      const activeLevels = userPrefs.selectedLevels;
      if (activeLevels.includes("ALL") || activeLevels.length === 0) {
        filteredDataset = [...fullDataset];
      } else {
        filteredDataset = fullDataset.filter(item => activeLevels.some(lvl => item.level.includes(lvl)));
      }

      document.getElementById("poolStatus").textContent = `${filteredDataset.length} 個字`;

      if (isFirstLoad && userPrefs.lastWord) {
        const found = filteredDataset.findIndex(item => item.word.toLowerCase() === userPrefs.lastWord.toLowerCase());
        currentIndex = found !== -1 ? found : 0;
      } else {
        currentIndex = 0;
      }

      if (filteredDataset.length > 0) renderCard(filteredDataset[currentIndex]);
    }

    function renderCard(item) {
      if (!item) return;

      document.getElementById("wordText").textContent = item.word;
      document.getElementById("posText").textContent = item.pos;
      document.getElementById("ukIpa").textContent = item.ipa;
      document.getElementById("usIpa").textContent = item.ipa;

      const badge = document.getElementById("cefrBadge");
      badge.textContent = item.level;
      badge.className = `cefr-badge ${item.level.toLowerCase()}`;

      document.getElementById("defEnText").textContent = item.definition;
      document.getElementById("examplesContainer").innerHTML = item.examples.map(ex => `<div class="example-item">• ${ex}</div>`).join("");

      document.getElementById("counterText").textContent = `${currentIndex + 1} / ${filteredDataset.length}`;
      document.getElementById("prevBtn").disabled = currentIndex === 0;
      document.getElementById("nextBtn").disabled = currentIndex === filteredDataset.length - 1;

      updateChineseTranslations(item);

      if (document.getElementById("autoPronounceToggle").checked) {
        speak(item.word, "en-GB");
      }

      saveUserPreferences();
    }

    async function updateChineseTranslations(item) {
      const showZh = document.getElementById("showZhToggle").checked;
      const zhWordEl = document.getElementById("zhWordText");
      const defZhEl = document.getElementById("defZhText");

      if (!showZh) {
        zhWordEl.style.display = "none";
        defZhEl.style.display = "none";
        return;
      }

      zhWordEl.style.display = "block";
      defZhEl.style.display = "block";

      if (item.zh) {
        zhWordEl.textContent = `【中文】${item.zh}`;
      } else {
        zhWordEl.textContent = "【中文】查詢中...";
        translateToZh(item.word).then(trans => {
          item.zh = trans;
          zhWordEl.textContent = trans ? `【中文】${trans}` : "";
        });
      }

      if (item.zhDef) {
        defZhEl.textContent = item.zhDef;
      } else {
        translateToZh(item.definition).then(trans => {
          item.zhDef = trans;
          defZhEl.textContent = trans;
        });
      }
    }

    function speak(text, lang = "en-GB") {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }

    // 多選按鈕
    document.querySelectorAll(".level-pill").forEach(pill => {
      pill.addEventListener("click", () => {
        const level = pill.dataset.level;
        if (level === "ALL") {
          userPrefs.selectedLevels = ["ALL"];
          document.querySelectorAll(".level-pill").forEach(p => p.classList.remove("active"));
          pill.classList.add("active");
        } else {
          userPrefs.selectedLevels = userPrefs.selectedLevels.filter(l => l !== "ALL");
          document.querySelector('.level-pill[data-level="ALL"]').classList.remove("active");

          if (userPrefs.selectedLevels.includes(level)) {
            userPrefs.selectedLevels = userPrefs.selectedLevels.filter(l => l !== level);
            pill.classList.remove("active");
          } else {
            userPrefs.selectedLevels.push(level);
            pill.classList.add("active");
          }

          if (userPrefs.selectedLevels.length === 0) {
            userPrefs.selectedLevels = ["ALL"];
            document.querySelector('.level-pill[data-level="ALL"]').classList.add("active");
          }
        }
        saveUserPreferences();
        applyFilters();
      });
    });

    // 觸控左右滑動支援（Swipe）
    let touchStartX = 0;
    let touchEndX = 0;
    const cardEl = document.getElementById("touchCard");

    cardEl.addEventListener("touchstart", (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });

    cardEl.addEventListener("touchend", (e) => {
      touchEndX = e.changedTouches[0].screenX;
      handleSwipe();
    }, { passive: true });

    function handleSwipe() {
      const threshold = 45;
      if (touchStartX - touchEndX > threshold && currentIndex < filteredDataset.length - 1) {
        // 向左滑 -> 下一個
        currentIndex++;
        renderCard(filteredDataset[currentIndex]);
      } else if (touchEndX - touchStartX > threshold && currentIndex > 0) {
        // 向右滑 -> 上一個
        currentIndex--;
        renderCard(filteredDataset[currentIndex]);
      }
    }

    // 事件監聽
    document.getElementById("showZhToggle").addEventListener("change", () => {
      if (filteredDataset[currentIndex]) updateChineseTranslations(filteredDataset[currentIndex]);
      saveUserPreferences();
    });
    document.getElementById("autoPronounceToggle").addEventListener("change", saveUserPreferences);

    document.getElementById("ukAudioBtn").addEventListener("click", () => speak(filteredDataset[currentIndex].word, "en-GB"));
    document.getElementById("usAudioBtn").addEventListener("click", () => speak(filteredDataset[currentIndex].word, "en-US"));

    document.getElementById("prevBtn").addEventListener("click", () => {
      if (currentIndex > 0) {
        currentIndex--;
        renderCard(filteredDataset[currentIndex]);
      }
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
      if (currentIndex < filteredDataset.length - 1) {
        currentIndex++;
        renderCard(filteredDataset[currentIndex]);
      }
    });

    document.getElementById("randomBtn").addEventListener("click", () => {
      if (filteredDataset.length === 0) return;
      currentIndex = Math.floor(Math.random() * filteredDataset.length);
      renderCard(filteredDataset[currentIndex]);
    });

    initVocabulary();
  </script>
</body>
</html>
