<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vocab Learner - Oxford & Cambridge (A1-C2)</title>
  <style>
    :root {
      --primary: #002147;       /* Oxford Deep Blue */
      --accent-blue: #0284c7;
      --accent-yellow: #f59e0b;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 1.5rem 1rem;
    }

    .container {
      width: 100%;
      max-width: 720px;
    }

    /* 頂部搜尋與歷史功能列 */
    .header-bar {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 0.85rem;
    }

    .search-input {
      flex: 1;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 1rem;
      outline: none;
      background: #fff;
    }

    .btn {
      padding: 0.75rem 1.1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      background: #fff;
      cursor: pointer;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: all 0.2s;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .btn-primary:hover {
      background: #0f3460;
    }

    .btn-quiz-mode {
      background: #7c3aed;
      color: #fff;
      border-color: #7c3aed;
    }

    .btn-quiz-mode:hover {
      background: #6d28d9;
    }

    /* 難度選擇 Panel (放大版) */
    .filter-section {
      background: #fff;
      padding: 1.25rem 1.4rem;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 0.85rem;
      box-shadow: 0 2px 10px rgba(0, 33, 71, 0.04);
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .filter-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.6rem;
    }

    .filter-label {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--primary);
      margin-right: 0.2rem;
    }

    .level-pill {
      padding: 0.55rem 1.15rem;
      border-radius: 30px;
      border: 1.5px solid var(--border);
      background: #f8fafc;
      font-size: 0.95rem;
      font-weight: 700;
      color: #334155;
      cursor: pointer;
      user-select: none;
      transition: all 0.15s ease-in-out;
    }

    .level-pill:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }

    .level-pill.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
      box-shadow: 0 2px 6px rgba(0, 33, 71, 0.2);
    }

    .level-pill.c2.active {
      background: #6b21a8;
      border-color: #6b21a8;
      box-shadow: 0 2px 6px rgba(107, 33, 168, 0.25);
    }

    .pref-row {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      font-size: 0.95rem;
      color: var(--text-muted);
      border-top: 1px dashed var(--border);
      padding-top: 0.75rem;
    }

    .toggle-item {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      cursor: pointer;
      user-select: none;
    }

    .toggle-item input[type="checkbox"] {
      width: 17px;
      height: 17px;
      cursor: pointer;
    }

    /* 總數顯示 */
    .count-bar {
      display: flex;
      justify-content: flex-end;
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.65rem;
      padding: 0 0.25rem;
    }

    /* 單字卡片主體 */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 2.25rem;
      box-shadow: 0 4px 22px rgba(0, 33, 71, 0.08);
      border: 1px solid var(--border);
      min-height: 420px;
      display: flex;
      flex-direction: column;
    }

    .word-header {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-bottom: 0.3rem;
    }

    .word-title {
      font-size: 2.75rem;
      font-weight: 700;
      color: var(--primary);
      letter-spacing: -0.5px;
    }

    .pos-tag {
      font-style: italic;
      color: var(--text-muted);
      font-size: 1.15rem;
    }

    .zh-word-translation {
      font-size: 1.3rem;
      font-weight: 600;
      color: #047857;
      margin-bottom: 0.5rem;
    }

    /* 發音區 */
    .pron-bar {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      margin: 0.6rem 0 1.25rem 0;
      padding-bottom: 1rem;
      border-bottom: 2px solid var(--accent-yellow);
    }

    .pron-group {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .pron-region {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--accent-blue);
    }

    .ipa {
      font-family: "Lucida Sans Unicode", "DejaVu Sans", Arial, sans-serif;
      font-size: 1.05rem;
    }

    .audio-btn {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      cursor: pointer;
      color: var(--accent-blue);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      transition: transform 0.15s, background 0.2s;
    }

    .audio-btn:hover {
      transform: scale(1.1);
      background: #dbeafe;
    }

    /* CEFR 徽章 */
    .cefr-badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      margin-bottom: 0.85rem;
      width: fit-content;
    }

    .cefr-badge.c2 { background: #fae8ff; color: #6b21a8; border: 1px solid #e9d5ff; }
    .cefr-badge.c1 { background: #f3e8ff; color: #7e22ce; }
    .cefr-badge.b2, .cefr-badge.b1 { background: #e0f2fe; color: #0369a1; }
    .cefr-badge.a2, .cefr-badge.a1 { background: #dcfce7; color: #15803d; }

    /* 學習模式專屬區域 */
    .learn-view {
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .def-container {
      margin-bottom: 1.25rem;
    }

    .definition-en {
      font-size: 1.18rem;
      font-weight: 600;
      line-height: 1.45;
      color: #1e293b;
      margin-bottom: 0.35rem;
    }

    .definition-zh {
      font-size: 1.02rem;
      color: #475569;
      line-height: 1.4;
    }

    .examples-box {
      margin-top: auto;
      background: #f8fafc;
      padding: 1.1rem 1.3rem;
      border-radius: 10px;
      border-left: 4px solid var(--accent-blue);
    }

    .examples-title {
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .example-item {
      font-size: 0.98rem;
      line-height: 1.5;
      color: #334155;
      margin-bottom: 0.4rem;
    }

    /* 測驗模式 (QUIZ MODE) 專屬區域 */
    .quiz-view {
      display: none;
      flex-direction: column;
      flex: 1;
      gap: 1rem;
    }

    .quiz-instruction {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .quiz-options-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .quiz-option-card {
      padding: 1.1rem 1.25rem;
      border-radius: 12px;
      border: 1.5px solid var(--border);
      background: #f8fafc;
      cursor: pointer;
      display: flex;
      gap: 0.85rem;
      align-items: flex-start;
      transition: all 0.2s ease-in-out;
    }

    .quiz-option-card:hover:not(.locked) {
      background: #eff6ff;
      border-color: var(--accent-blue);
      transform: translateY(-2px);
    }

    .option-letter {
      background: #e2e8f0;
      color: var(--primary);
      font-weight: 700;
      font-size: 0.9rem;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .option-content {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .option-en {
      font-size: 1.05rem;
      font-weight: 600;
      color: #1e293b;
      line-height: 1.4;
    }

    .option-zh {
      font-size: 0.95rem;
      color: #047857;
      line-height: 1.35;
      font-weight: 500;
    }

    /* 測驗答題反饋樣式 */
    .quiz-option-card.correct {
      background: #ecfdf5 !important;
      border-color: #10b981 !important;
    }
    .quiz-option-card.correct .option-letter {
      background: #10b981;
      color: #fff;
    }

    .quiz-option-card.wrong {
      background: #fef2f2 !important;
      border-color: #ef4444 !important;
    }
    .quiz-option-card.wrong .option-letter {
      background: #ef4444;
      color: #fff;
    }

    .quiz-option-card.locked {
      cursor: default;
    }

    /* 底部按鈕區 */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.25rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .left-controls {
      display: flex;
      align-items: center;
      gap: 0.85rem;
    }

    .history-indicator {
      color: var(--text-muted);
      font-size: 0.92rem;
      font-weight: 500;
    }

    .nav-group {
      display: flex;
      gap: 0.6rem;
    }

    /* 歷史記錄彈窗 */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      padding: 1rem;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 520px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .modal-header {
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--primary);
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
    }

    .modal-body {
      padding: 1rem 1.5rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .history-item {
      padding: 0.75rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.15s;
    }

    .history-item:hover {
      background: #eff6ff;
      border-color: var(--accent-blue);
    }

    .history-word-col {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }

    .history-word {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--primary);
    }

    .history-zh {
      font-size: 0.92rem;
      color: #047857;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 頂部搜尋與抽字 -->
    <div class="header-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="搜尋生字 (例: violent, ubiquitous)..." />
      <button class="btn" id="historyBtn" title="查看最近 10 個生字">📜 歷史記錄</button>
      <button class="btn btn-primary" id="randomTopBtn">隨機抽字 🎲</button>
    </div>

    <!-- 難度選擇 Panel (放大版) -->
    <div class="filter-section">
      <div class="filter-row">
        <span class="filter-label">難度多選：</span>
        <div class="level-pill" data-level="ALL">全部 (All)</div>
        <div class="level-pill" data-level="A1">A1</div>
        <div class="level-pill" data-level="A2">A2</div>
        <div class="level-pill" data-level="B1">B1</div>
        <div class="level-pill" data-level="B2">B2</div>
        <div class="level-pill" data-level="C1">C1</div>
        <div class="level-pill c2" data-level="C2">C2 (Mastery/GRE)</div>
      </div>

      <div class="pref-row">
        <label class="toggle-item">
          <input type="checkbox" id="showZhToggle" checked> 顯示中文意思
        </label>
        <label class="toggle-item">
          <input type="checkbox" id="autoPronounceToggle"> 切換時自動發音
        </label>
      </div>
    </div>

    <!-- 總數顯示 -->
    <div class="count-bar" id="countSummary">詞庫總數：載入中...</div>

    <!-- 單字卡片主體 -->
    <div class="card">
      <div class="word-header">
        <h1 class="word-title" id="wordText">---</h1>
        <span class="pos-tag" id="posText"></span>
      </div>

      <!-- 中文單字直譯（在學習模式時顯示） -->
      <div class="zh-word-translation" id="zhWordText">---</div>

      <!-- 發音區 -->
      <div class="pron-bar">
        <div class="pron-group">
          <span class="pron-region">UK</span>
          <button class="audio-btn" id="ukAudioBtn" title="英國發音 (按 1)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
          </button>
          <span class="ipa" id="ukIpa"></span>
        </div>

        <div class="pron-group">
          <span class="pron-region">US</span>
          <button class="audio-btn" id="usAudioBtn" title="美國發音 (按 2)">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
          </button>
          <span class="ipa" id="usIpa"></span>
        </div>
      </div>

      <!-- CEFR 徽章 -->
      <div id="cefrBadge" class="cefr-badge b2">B2</div>

      <!-- 模式一：學習模式檢視 -->
      <div class="learn-view" id="learnView">
        <div class="def-container">
          <div class="definition-en" id="defEnText">---</div>
          <div class="definition-zh" id="defZhText">---</div>
        </div>

        <div class="examples-box">
          <div class="examples-title">Examples</div>
          <div id="examplesContainer">---</div>
        </div>
      </div>

      <!-- 模式二：QUIZ MODE 測驗檢視 -->
      <div class="quiz-view" id="quizView">
        <div class="quiz-instruction">
          <span>🎯 請選擇符合此單字的正確中英文解釋：</span>
          <span id="quizScoreBadge" style="font-size:0.9rem;color:var(--text-muted);">答對: 0 / 0</span>
        </div>
        <div class="quiz-options-list" id="quizOptionsContainer">
          <!-- 動態載入 3 個三選一選項 -->
        </div>
      </div>
    </div>

    <!-- 底部導覽控制列 -->
    <div class="controls">
      <!-- 最底歷史記錄左邊：新增 QUIZ MODE 按鈕 -->
      <div class="left-controls">
        <button class="btn btn-quiz-mode" id="toggleQuizBtn">🎮 QUIZ MODE</button>
        <span class="history-indicator" id="historyIndicator">歷史位置：1 / 1</span>
      </div>

      <div class="nav-group">
        <button class="btn" id="prevBtn" disabled>← 上一個 (歷史記錄)</button>
        <button class="btn btn-primary" id="nextBtn">下一個隨機 🎲 (→)</button>
      </div>
    </div>
  </div>

  <!-- 歷史記錄彈窗 -->
  <div class="modal-overlay" id="historyModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">📜 最近學習記錄（最多 10 個）</div>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>
      <div class="modal-body" id="historyListContainer"></div>
    </div>
  </div>

  <script>
    const OXFORD_5000_URL = "https://raw.githubusercontent.com/winterdl/oxford-5000-vocabulary-audio-definition/main/data/oxford_5000.json";
    const PREF_KEY = "vocab_app_preferences_v5";

    // Cambridge / GRE C2 精通級生字庫
    const c2WordList = [
      {
        word: "ubiquitous",
        pos: "adjective",
        level: "C2",
        ipa: "/juːˈbɪk.wə.təs/",
        zh: "無處不在的；普遍存在的",
        definition: "seeming to be in all places at the same time:",
        zhDef: "似乎無所不在的；十分普遍的",
        examples: ["Smartphones have become ubiquitous in daily life.", "his ubiquitous influence on modern art"]
      },
      {
        word: "ephemeral",
        pos: "adjective",
        level: "C2",
        ipa: "/ɪˈfem.ər.əl/",
        zh: "短暫的；轉瞬即逝的",
        definition: "lasting for only a short time:",
        zhDef: "僅持續很短時間的；生命短暫的",
        examples: ["Fame in the internet age is often ephemeral.", "ephemeral pleasures"]
      },
      {
        word: "preposterous",
        pos: "adjective",
        level: "C2",
        ipa: "/prɪˈpɒs.tər.əs/",
        zh: "荒謬的；反常的",
        definition: "very silly or stupid; completely unreasonable:",
        zhDef: "荒唐的；極其荒謬無稽的",
        examples: ["The very idea is preposterous!", "It's preposterous to blame him for everything."]
      },
      {
        word: "anecdotal",
        pos: "adjective",
        level: "C2",
        ipa: "/ˌæn.ɪkˈdəʊ.təl/",
        zh: "軼事的；道聽途說的",
        definition: "based on personal stories rather than facts or research:",
        zhDef: "基於個人傳聞而非科學依據的",
        examples: ["Anecdotal evidence suggests that the drug is effective.", "These are just anecdotal reports."]
      },
      {
        word: "capricious",
        pos: "adjective",
        level: "C2",
        ipa: "/kəˈprɪʃ.əs/",
        zh: "反覆無常的；善變的",
        definition: "changing mood or behaviour suddenly and unexpectedly:",
        zhDef: "脾氣或行為變化莫測的",
        examples: ["a capricious climate with sudden storms", "the capricious nature of the stock market"]
      },
      {
        word: "taciturn",
        pos: "adjective",
        level: "C2",
        ipa: "/ˈtæs.ɪ.tɜːn/",
        zh: "沉默寡言的；不苟言語的",
        definition: "tending not to speak much; reserved in speech:",
        zhDef: "不愛說話的；安靜冷淡的",
        examples: ["He was a taciturn man who rarely shared his thoughts.", "a strangely taciturn youth"]
      },
      {
        word: "serendipity",
        pos: "noun",
        level: "C2",
        ipa: "/ˌser.ənˈdɪp.ə.ti/",
        zh: "意外收穫；機緣巧合",
        definition: "the fact of finding interesting or valuable things by chance:",
        zhDef: "偶然發現有趣或珍貴事物的好運氣",
        examples: ["Finding this café was pure serendipity.", "scientific breakthroughs born of serendipity"]
      }
    ];

    const fallbackWords = [
      {
        word: "violent",
        pos: "adjective",
        level: "B2",
        ipa: "/ˈvaɪələnt/",
        zh: "暴力的；猛烈的；狂暴的",
        definition: "involving violence; using or showing great physical force:",
        zhDef: "涉及暴力的；強烈狂暴的",
        examples: ["a victim of violent crime", "a violent protest", "I don't like violent films (= films that show violence)."]
      },
      {
        word: "attractive",
        pos: "adjective",
        level: "A2",
        ipa: "/əˈtræk.tɪv/",
        zh: "有吸引力的；動人的",
        definition: "pleasant to look at, or causing interest or pleasure:",
        zhDef: "悅目的；引起興趣的",
        examples: ["an attractive woman/man", "The offer is very attractive."]
      },
      {
        word: "slender",
        pos: "adjective",
        level: "C1",
        ipa: "/ˈslen.dər/",
        zh: "纖細的；修長的；苗條的",
        definition: "thin and delicate, often in a way that is attractive:",
        zhDef: "修長苗條的；清秀纖弱的",
        examples: ["She had a slender figure and long legs.", "He had slender hands."]
      }
    ];

    let fullDataset = [];
    let filteredDataset = [];
    const translationCache = {};

    let historyQueue = [];
    let historyPointer = -1;

    // QUIZ MODE 專屬狀態
    let isQuizMode = false;
    let quizAnswered = false;
    let quizStats = { total: 0, correct: 0 };
    let currentQuizItem = null;

    let userPrefs = {
      selectedLevels: ["ALL"],
      showZh: true,
      autoPronounce: false
    };

    function loadUserPreferences() {
      try {
        const saved = localStorage.getItem(PREF_KEY);
        if (saved) userPrefs = Object.assign(userPrefs, JSON.parse(saved));
      } catch (e) {}

      document.getElementById("showZhToggle").checked = userPrefs.showZh;
      document.getElementById("autoPronounceToggle").checked = userPrefs.autoPronounce;

      document.querySelectorAll(".level-pill").forEach(pill => {
        const lvl = pill.dataset.level;
        if (userPrefs.selectedLevels.includes(lvl)) pill.classList.add("active");
        else pill.classList.remove("active");
      });
    }

    function saveUserPreferences() {
      try {
        userPrefs.showZh = document.getElementById("showZhToggle").checked;
        userPrefs.autoPronounce = document.getElementById("autoPronounceToggle").checked;
        localStorage.setItem(PREF_KEY, JSON.stringify(userPrefs));
      } catch (e) {}
    }

    async function translateToZh(text) {
      if (!text) return "";
      if (translationCache[text]) return translationCache[text];
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=zh-TW&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url);
        const data = await res.json();
        const translated = data[0].map(item => item[0]).join('');
        translationCache[text] = translated;
        return translated;
      } catch (err) {
        return "";
      }
    }

    function normalizeItem(raw) {
      const word = raw.Spelling || raw.spelling || raw.word || raw.headword || "";
      const pos = raw.pos || raw["word type"] || raw.type || "";
      const level = (raw.cefr || raw.CEFR || raw.level || "B2").toUpperCase();
      const ipa = raw["Lexical spelling"] || raw.ipa || raw.pronunciation || "";
      const def = raw.Meaning || raw.meaning || raw.definition || raw.def || "No definition available.";
      
      let ex = raw.Example || raw.example || raw.examples || [];
      if (typeof ex === 'string') ex = ex ? [ex] : [];
      if (!Array.isArray(ex) || ex.length === 0) ex = ["(No example sentence provided)"];

      return {
        word: word.trim(),
        pos: pos.trim(),
        level: level.trim(),
        ipa: ipa.trim(),
        definition: def.trim(),
        zh: raw.zh || "",
        zhDef: raw.zhDef || "",
        examples: ex
      };
    }

    async function initVocabulary() {
      loadUserPreferences();

      try {
        const res = await fetch(OXFORD_5000_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const rawData = await res.json();
        const rawList = Array.isArray(rawData) ? rawData : Object.values(rawData);
        const oxfordWords = rawList.map(normalizeItem).filter(w => w.word.length > 0);
        fullDataset = [...c2WordList, ...oxfordWords];
      } catch (err) {
        fullDataset = [...c2WordList, ...fallbackWords];
      }

      applyFilters();
      drawRandomNextWord();
    }

    function applyFilters() {
      const activeLevels = userPrefs.selectedLevels;

      if (activeLevels.includes("ALL") || activeLevels.length === 0) {
        filteredDataset = [...fullDataset];
      } else {
        filteredDataset = fullDataset.filter(item => {
          return activeLevels.some(lvl => item.level.includes(lvl));
        });
      }

      document.getElementById("countSummary").textContent = 
        `詞庫總數：${fullDataset.length.toLocaleString()} 字（符合條件：${filteredDataset.length.toLocaleString()} 字）`;
    }

    // 隨機抽取下一個生字（學習模式與測驗模式通用）
    function drawRandomNextWord() {
      if (filteredDataset.length === 0) return;

      const randomIdx = Math.floor(Math.random() * filteredDataset.length);
      const chosenWord = filteredDataset[randomIdx];

      if (isQuizMode) {
        generateQuiz(chosenWord);
      } else {
        if (historyPointer < historyQueue.length - 1) {
          historyQueue = historyQueue.slice(0, historyPointer + 1);
        }
        historyQueue.push(chosenWord);
        historyPointer = historyQueue.length - 1;
        renderCard(chosenWord);
      }
    }

    function goBackHistory() {
      if (historyPointer > 0 && !isQuizMode) {
        historyPointer--;
        renderCard(historyQueue[historyPointer]);
      }
    }

    // 渲染學習模式卡片
    async function renderCard(item) {
      if (!item) return;

      document.getElementById("wordText").textContent = item.word;
      document.getElementById("posText").textContent = item.pos;
      document.getElementById("ukIpa").textContent = item.ipa;
      document.getElementById("usIpa").textContent = item.ipa;

      const badge = document.getElementById("cefrBadge");
      badge.textContent = item.level;
      badge.className = `cefr-badge ${item.level.toLowerCase()}`;

      document.getElementById("defEnText").textContent = item.definition;

      const container = document.getElementById("examplesContainer");
      container.innerHTML = item.examples.map(ex => `<div class="example-item">• ${ex}</div>`).join("");

      document.getElementById("prevBtn").disabled = historyPointer <= 0;
      document.getElementById("historyIndicator").textContent = 
        `歷史位置：${historyPointer + 1} / ${historyQueue.length}`;

      updateChineseTranslations(item);

      if (document.getElementById("autoPronounceToggle").checked) {
        speak(item.word, "en-GB");
      }
    }

    // 產生測驗模式題目 (3 個選項，每個有中英文解釋)
    async function generateQuiz(targetWord) {
      currentQuizItem = targetWord;
      quizAnswered = false;

      // 設置題目的生字、音標與難度徽章
      document.getElementById("wordText").textContent = targetWord.word;
      document.getElementById("posText").textContent = targetWord.pos;
      document.getElementById("ukIpa").textContent = targetWord.ipa;
      document.getElementById("usIpa").textContent = targetWord.ipa;

      const badge = document.getElementById("cefrBadge");
      badge.textContent = targetWord.level;
      badge.className = `cefr-badge ${targetWord.level.toLowerCase()}`;

      // 在測驗模式隱藏上方直接的中文答案
      document.getElementById("zhWordText").style.display = "none";

      // 挑選 2 個干擾項（同難度或詞庫其他生字）
      const pool = filteredDataset.length >= 3 ? filteredDataset : fullDataset;
      const distractors = [];
      while (distractors.length < 2) {
        const rand = pool[Math.floor(Math.random() * pool.length)];
        if (rand.word !== targetWord.word && !distractors.some(d => d.word === rand.word)) {
          distractors.push(rand);
        }
      }

      // 組成 3 個選項並隨機打亂 (Shuffle)
      const options = [
        { isCorrect: true, item: targetWord },
        { isCorrect: false, item: distractors[0] },
        { isCorrect: false, item: distractors }
      ].sort(() => Math.random() - 0.5);

      const letters = ["A", "B", "C"];
      const container = document.getElementById("quizOptionsContainer");
      container.innerHTML = "";

      options.forEach((opt, idx) => {
        const card = document.createElement("div");
        card.className = "quiz-option-card";
        card.dataset.correct = opt.isCorrect ? "true" : "false";

        card.innerHTML = `
          <div class="option-letter">${letters[idx]}</div>
          <div class="option-content">
            <div class="option-en">${opt.item.definition}</div>
            <div class="option-zh">中文載入中...</div>
          </div>
        `;

        // 異步載入中文解釋
        const zhEl = card.querySelector(".option-zh");
        if (opt.item.zhDef) {
          zhEl.textContent = opt.item.zhDef;
        } else {
          translateToZh(opt.item.definition).then(trans => {
            opt.item.zhDef = trans;
            zhEl.textContent = trans || "(無中文解釋)";
          });
        }

        // 點擊選項答題
        card.addEventListener("click", () => handleQuizSelection(card, opt.isCorrect));
        container.appendChild(card);
      });

      if (document.getElementById("autoPronounceToggle").checked) {
        speak(targetWord.word, "en-GB");
      }
    }

    // 處理答題反饋
    function handleQuizSelection(selectedCard, isCorrect) {
      if (quizAnswered) return;
      quizAnswered = true;

      quizStats.total++;
      if (isCorrect) quizStats.correct++;

      document.getElementById("quizScoreBadge").textContent = 
        `答對: ${quizStats.correct} / ${quizStats.total} 題`;

      const allCards = document.querySelectorAll(".quiz-option-card");
      allCards.forEach(card => {
        card.classList.add("locked");
        if (card.dataset.correct === "true") {
          card.classList.add("correct");
        }
      });

      if (!isCorrect) {
        selectedCard.classList.add("wrong");
      }
    }

    // 切換 學習模式 <-> 測驗模式 (QUIZ MODE)
    document.getElementById("toggleQuizBtn").addEventListener("click", () => {
      isQuizMode = !isQuizMode;

      const toggleBtn = document.getElementById("toggleQuizBtn");
      const learnView = document.getElementById("learnView");
      const quizView = document.getElementById("quizView");
      const prevBtn = document.getElementById("prevBtn");
      const historyIndicator = document.getElementById("historyIndicator");

      if (isQuizMode) {
        toggleBtn.textContent = "📖 返回學習模式";
        toggleBtn.style.background = "#0284c7";
        toggleBtn.style.borderColor = "#0284c7";

        learnView.style.display = "none";
        quizView.style.display = "flex";

        prevBtn.style.display = "none";
        historyIndicator.textContent = "🎮 測驗進行中";

        drawRandomNextWord();
      } else {
        toggleBtn.textContent = "🎮 QUIZ MODE";
        toggleBtn.style.background = "#7c3aed";
        toggleBtn.style.borderColor = "#7c3aed";

        learnView.style.display = "flex";
        quizView.style.display = "none";

        prevBtn.style.display = "inline-flex";
        if (historyQueue[historyPointer]) {
          renderCard(historyQueue[historyPointer]);
        }
      }
    });

    async function updateChineseTranslations(item) {
      const showZh = document.getElementById("showZhToggle").checked;
      const zhWordEl = document.getElementById("zhWordText");
      const defZhEl = document.getElementById("defZhText");

      if (!showZh || isQuizMode) {
        zhWordEl.style.display = "none";
        defZhEl.style.display = "none";
        return;
      }

      zhWordEl.style.display = "block";
      defZhEl.style.display = "block";

      if (item.zh) {
        zhWordEl.textContent = `【中文】${item.zh}`;
      } else {
        zhWordEl.textContent = "【中文】查詢中...";
        translateToZh(item.word).then(trans => {
          item.zh = trans;
          zhWordEl.textContent = trans ? `【中文】${trans}` : "";
        });
      }

      if (item.zhDef) {
        defZhEl.textContent = item.zhDef;
      } else {
        translateToZh(item.definition).then(trans => {
          item.zhDef = trans;
          defZhEl.textContent = trans;
        });
      }
    }

    function speak(text, lang = "en-GB") {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = lang;
      utterance.rate = 0.85;
      window.speechSynthesis.speak(utterance);
    }

    // 難度 Pill 多選切換
    document.querySelectorAll(".level-pill").forEach(pill => {
      pill.addEventListener("click", () => {
        const level = pill.dataset.level;

        if (level === "ALL") {
          userPrefs.selectedLevels = ["ALL"];
          document.querySelectorAll(".level-pill").forEach(p => p.classList.remove("active"));
          pill.classList.add("active");
        } else {
          userPrefs.selectedLevels = userPrefs.selectedLevels.filter(l => l !== "ALL");
          document.querySelector('.level-pill[data-level="ALL"]').classList.remove("active");

          if (userPrefs.selectedLevels.includes(level)) {
            userPrefs.selectedLevels = userPrefs.selectedLevels.filter(l => l !== level);
            pill.classList.remove("active");
          } else {
            userPrefs.selectedLevels.push(level);
            pill.classList.add("active");
          }

          if (userPrefs.selectedLevels.length === 0) {
            userPrefs.selectedLevels = ["ALL"];
            document.querySelector('.level-pill[data-level="ALL"]').classList.add("active");
          }
        }

        saveUserPreferences();
        applyFilters();
        drawRandomNextWord();
      });
    });

    document.getElementById("showZhToggle").addEventListener("change", () => {
      if (!isQuizMode && historyQueue[historyPointer]) {
        updateChineseTranslations(historyQueue[historyPointer]);
      }
      saveUserPreferences();
    });

    document.getElementById("autoPronounceToggle").addEventListener("change", saveUserPreferences);

    document.getElementById("ukAudioBtn").addEventListener("click", () => {
      const w = isQuizMode ? currentQuizItem?.word : historyQueue[historyPointer]?.word;
      if (w) speak(w, "en-GB");
    });

    document.getElementById("usAudioBtn").addEventListener("click", () => {
      const w = isQuizMode ? currentQuizItem?.word : historyQueue[historyPointer]?.word;
      if (w) speak(w, "en-US");
    });

    // 下一個 / 隨機抽字 / 上一個歷史
    document.getElementById("nextBtn").addEventListener("click", drawRandomNextWord);
    document.getElementById("randomTopBtn").addEventListener("click", drawRandomNextWord);
    document.getElementById("prevBtn").addEventListener("click", goBackHistory);

    // 歷史記錄彈窗
    const historyModal = document.getElementById("historyModal");
    const historyBtn = document.getElementById("historyBtn");
    const closeModalBtn = document.getElementById("closeModalBtn");
    const historyListContainer = document.getElementById("historyListContainer");

    historyBtn.addEventListener("click", () => {
      const recentWords = [...historyQueue].reverse().slice(0, 10);
      historyListContainer.innerHTML = "";

      if (recentWords.length === 0) {
        historyListContainer.innerHTML = "<div style='color:var(--text-muted);text-align:center;padding:1.5rem;'>暫無學習歷史</div>";
      } else {
        recentWords.forEach(item => {
          const div = document.createElement("div");
          div.className = "history-item";
          div.innerHTML = `
            <div class="history-word-col">
              <span class="history-word">${item.word}</span>
              <span style="font-size:0.85rem;color:var(--text-muted);font-style:italic;">${item.pos}</span>
              <span class="cefr-badge ${item.level.toLowerCase()}" style="margin:0;padding:0.1rem 0.4rem;font-size:0.75rem;">${item.level}</span>
            </div>
            <span class="history-zh">${item.zh || "點擊查看"}</span>
          `;
          div.addEventListener("click", () => {
            if (isQuizMode) document.getElementById("toggleQuizBtn").click();
            const targetIdx = historyQueue.lastIndexOf(item);
            if (targetIdx !== -1) {
              historyPointer = targetIdx;
              renderCard(historyQueue[historyPointer]);
            }
            historyModal.classList.remove("open");
          });
          historyListContainer.appendChild(div);
        });
      }

      historyModal.classList.add("open");
    });

    closeModalBtn.addEventListener("click", () => historyModal.classList.remove("open"));
    historyModal.addEventListener("click", (e) => {
      if (e.target === historyModal) historyModal.classList.remove("open");
    });

    // 搜尋功能
    document.getElementById("searchInput").addEventListener("input", (e) => {
      const q = e.target.value.trim().toLowerCase();
      if (!q) return;
      const foundItem = filteredDataset.find(item => item.word.toLowerCase() === q || item.word.toLowerCase().startsWith(q));
      if (foundItem) {
        if (isQuizMode) document.getElementById("toggleQuizBtn").click();
        historyQueue.push(foundItem);
        historyPointer = historyQueue.length - 1;
        renderCard(foundItem);
      }
    });

    // 鍵盤操作捷徑 (← 上一個 / → 下一個 / 1 英音 / 2 美音 / H 歷史)
    window.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT") return;
      if (e.key === "ArrowLeft") {
        goBackHistory();
      } else if (e.key === "ArrowRight") {
        drawRandomNextWord();
      } else if (e.key === " " || e.key === "1") {
        e.preventDefault();
        const w = isQuizMode ? currentQuizItem?.word : historyQueue[historyPointer]?.word;
        if (w) speak(w, "en-GB");
      } else if (e.key === "2") {
        e.preventDefault();
        const w = isQuizMode ? currentQuizItem?.word : historyQueue[historyPointer]?.word;
        if (w) speak(w, "en-US");
      } else if (e.key.toLowerCase() === "h") {
        historyBtn.click();
      }
    });

    initVocabulary();
  </script>
</body>
</html>
